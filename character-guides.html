<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIUKSORYU — Character Guides</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#090615;overflow:hidden}
iframe{display:block;width:100%;height:100vh;border:0}
</style>
</head>
<body>
<iframe id="guide" src="LIUKSORYU_Guide_Builder_OBS_EXPORT_READY_SELF_CONTAINED_CLEANED.html" title="LIUKSORYU Character Guide"></iframe>
<script>
(function(){
  var frame=document.getElementById('guide');
  frame.addEventListener('load',function(){
    try{
      var doc=frame.contentDocument;
      if(!doc)return;
      var selectors=[
        '#editGuideButton','#editGuide','#editModeToggle','#editModeButton',
        '.edit-guide','.edit-mode','.editor-controls','.edit-controls',
        '[data-edit]','button[title*="Edit"]','button[aria-label*="Edit"]'
      ];
      selectors.forEach(function(selector){
        doc.querySelectorAll(selector).forEach(function(el){el.style.setProperty('display','none','important');});
      });
      doc.querySelectorAll('button').forEach(function(el){
        var text=(el.textContent||'').trim().toLowerCase();
        if(text==='edit guide'||text==='edit')el.style.setProperty('display','none','important');
      });
    }catch(e){}
  });
})();
</script>
</body>
</html>
