<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIUKSORYU — Character Guides</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#090615;overflow:hidden}
iframe{display:block;width:100%;height:100vh;border:0}
</style>
</head>
<body>
<iframe id="guide" src="LIUKSORYU_Guide_Builder_OBS_EXPORT_READY_SELF_CONTAINED_CLEANED.html" title="LIUKSORYU Character Guide"></iframe>
<script>
(function(){
  var frame=document.getElementById('guide');
  function hideEditControls(){
    try{
      var doc=frame.contentDocument;
      if(!doc)return;
      var selectors=[
        '#editGuideButton','#editGuide','#editModeToggle','#editModeButton',
        '.edit-guide','.edit-mode','.editor-controls','.edit-controls',
        '[data-edit]','[id*="edit"]','[class*="edit"]',
        'button[title*="Edit"]','button[aria-label*="Edit"]'
      ];
      selectors.forEach(function(selector){
        doc.querySelectorAll(selector).forEach(function(el){
          var text=(el.textContent||'').trim().toLowerCase();
          var attr=((el.getAttribute('title')||'')+' '+(el.getAttribute('aria-label')||'')).toLowerCase();
          if(selector.indexOf('[id*="edit"]')===-1 && selector.indexOf('[class*="edit"]')===-1 || text==='edit' || text==='edit guide' || attr.indexOf('edit')!==-1){
            el.style.setProperty('display','none','important');
            el.style.setProperty('visibility','hidden','important');
            el.style.setProperty('pointer-events','none','important');
          }
        });
      });
      doc.querySelectorAll('button,a,[role="button"]').forEach(function(el){
        var text=(el.textContent||'').trim().toLowerCase();
        var attr=((el.getAttribute('title')||'')+' '+(el.getAttribute('aria-label')||'')).toLowerCase();
        if(text==='edit'||text==='edit guide'||text.indexOf('edit guide')!==-1||attr.indexOf('edit guide')!==-1){
          el.style.setProperty('display','none','important');
          el.style.setProperty('visibility','hidden','important');
          el.style.setProperty('pointer-events','none','important');
        }
      });
    }catch(e){}
  }
  frame.addEventListener('load',function(){
    hideEditControls();
    setTimeout(hideEditControls,100);
    setTimeout(hideEditControls,500);
    setTimeout(hideEditControls,1000);
    try{
      var doc=frame.contentDocument;
      if(doc&&doc.body){
        var observer=new MutationObserver(hideEditControls);
        observer.observe(doc.body,{subtree:true,childList:true,attributes:true});
      }
    }catch(e){}
  });
})();
</script>
</body>
</html>
