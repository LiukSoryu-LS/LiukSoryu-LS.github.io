      var styleId='liuksoryu-public-viewer-fix';var style=doc.getElementById(styleId);if(!style){style=doc.createElement('style');style.id=styleId;style.textContent='.image-slot::after,.image-slot .placeholder,.image-slot .image-placeholder,.image-slot [class*="placeholder"]{display:none!important;content:none!important}.image-slot img{position:relative;z-index:1}';(doc.head||doc.documentElement).appendChild(style)}

})();
