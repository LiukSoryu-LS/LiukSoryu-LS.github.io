<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIUKSORYU — Character Guides</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#090615;overflow:hidden}
iframe{display:block;width:100%;height:100vh;border:0}
#homeBtn{position:fixed;top:18px;left:18px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border:2px solid transparent;border-radius:12px;background:linear-gradient(rgba(25,15,48,.92),rgba(25,15,48,.92)) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;color:#fff;text-decoration:none;font:800 13px system-ui,sans-serif;letter-spacing:.03em;box-shadow:0 6px 22px rgba(0,0,0,.3);backdrop-filter:blur(8px)}
#homeBtn:hover{background:linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;color:#160b22;transform:translateY(-1px)}
@media(max-width:600px){#homeBtn{top:10px;left:10px;padding:9px 12px;font-size:12px}}
</style>
</head>
<body>
<a id="homeBtn" href="index.html" aria-label="Back to Home">← Home</a>
<iframe id="guide" src="LIUKSORYU_Guide_Builder_OBS_EXPORT_READY_SELF_CONTAINED_CLEANED.html" title="LIUKSORYU Character Guide"></iframe>
<script>
(function(){
  var frame=document.getElementById('guide');
  function protectPublicViewer(){
    try{
      var doc=frame.contentDocument;
      if(!doc)return;
      var editSelectors=['#editGuideButton','#editGuide','#editModeToggle','#editModeButton','.edit-guide','.edit-mode','.editor-controls','.edit-controls','[data-edit]','[id*="edit"]','[class*="edit"]','button[title*="Edit"]','button[aria-label*="Edit"]'];
      editSelectors.forEach(function(selector){doc.querySelectorAll(selector).forEach(function(el){var text=(el.textContent||'').trim().toLowerCase();var attr=((el.getAttribute('title')||'')+' '+(el.getAttribute('aria-label')||'')).toLowerCase();if(selector.indexOf('[id*="edit"]')===-1&&selector.indexOf('[class*="edit"]')===-1||text==='edit'||text==='edit guide'||attr.indexOf('edit')!==-1){el.style.setProperty('display','none','important');el.style.setProperty('visibility','hidden','important');el.style.setProperty('pointer-events','none','important')}})});
      doc.querySelectorAll('button,a,[role="button"]').forEach(function(el){var text=(el.textContent||'').trim().toLowerCase();var attr=((el.getAttribute('title')||'')+' '+(el.getAttribute('aria-label')||'')).toLowerCase();if(text==='edit'||text==='edit guide'||text.indexOf('edit guide')!==-1||attr.indexOf('edit guide')!==-1){el.style.setProperty('display','none','important');el.style.setProperty('visibility','hidden','important');el.style.setProperty('pointer-events','none','important')}});
      var styleId='liuksoryu-public-viewer-fix';var style=doc.getElementById(styleId);if(!style){style=doc.createElement('style');style.id=styleId;style.textContent='.image-slot::after,.image-slot .placeholder,.image-slot .image-placeholder,.image-slot [class*="placeholder"]{display:none!important;content:none!important}.image-slot img{position:relative;z-index:1}';(doc.head||doc.documentElement).appendChild(style)}
    }catch(e){}
  }
  frame.addEventListener('load',function(){protectPublicViewer();setTimeout(protectPublicViewer,100);setTimeout(protectPublicViewer,500);setTimeout(protectPublicViewer,1000);try{var doc=frame.contentDocument;if(doc&&doc.body){var observer=new MutationObserver(protectPublicViewer);observer.observe(doc.body,{subtree:true,childList:true,attributes:true})}}catch(e){}});
})();
</script>
</body>
</html>
