name: Add Spotify footer icon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Spotify icon
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<a class="footer-social" href="https://space.bilibili.com/3707055856683500?spm_id_from=333.1387.0.0" target="_blank" rel="noopener" aria-label="Bilibili">'
          spotify = '<a class="footer-social" href="https://open.spotify.com/show/3Fa75fsoqh2IGwPEzOxyUg?si=b1648db761b549ba" target="_blank" rel="noopener" aria-label="Spotify"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm4.13 12.9a.75.75 0 0 1-1.03.25c-2.83-1.73-6.39-2.12-10.58-1.16a.75.75 0 1 1-.34-1.46c4.59-1.05 8.52-.6 11.7 1.34.35.21.46.67.25 1.03Zm1.39-3.1a.94.94 0 0 1-1.29.31c-3.24-1.99-8.18-2.57-12.01-1.4a.94.94 0 1 1-.55-1.8c4.38-1.33 9.83-.69 13.55 1.59.44.27.57.85.3 1.3Zm.12-3.24C13.76 7.3 7.35 7.05 3.63 8.18a1.13 1.13 0 0 1-.66-2.16c4.28-1.3 11.39-1.05 15.7 1.51a1.13 1.13 0 0 1-1.03 2.03Z"/></svg></a>'
          if 'aria-label="Spotify"' not in s:
              if marker not in s:
                  raise SystemExit('Bilibili footer icon marker not found')
              s = s.replace(marker, spotify + marker, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Spotify footer link"
          git rm .github/workflows/add-spotify-footer.yml
          git commit -m "Remove one-time Spotify footer workflow"
          git push
