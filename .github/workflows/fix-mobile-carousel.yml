name: Fix mobile preview carousel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch carousel drag support
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script id="mobile-preview-carousel-drag-fix-v2">'

          if marker in text:
              print('Carousel drag fix v2 already present.')
              raise SystemExit(0)

          patch = r'''<script id="mobile-preview-carousel-drag-fix-v2">
          (function(){
            if(!new URLSearchParams(window.location.search).has('mobile-preview')) return;
            var games=document.querySelector('.games');
            if(!games) return;

            games.style.cursor='grab';
            games.style.userSelect='none';
            games.style.webkitUserSelect='none';
            games.style.touchAction='pan-x';

            var dragging=false;
            var dragged=false;
            var startX=0;
            var startScroll=0;

            games.addEventListener('mousedown',function(e){
              if(e.button!==0) return;
              dragging=true;
              dragged=false;
              startX=e.clientX;
              startScroll=games.scrollLeft;
              games.style.cursor='grabbing';
              e.preventDefault();
            });

            window.addEventListener('mousemove',function(e){
              if(!dragging) return;
              var dx=e.clientX-startX;
              if(Math.abs(dx)>4) dragged=true;
              if(!dragged) return;
              games.scrollLeft=startScroll-dx;
              e.preventDefault();
            },true);

            function stopDrag(){
              if(!dragging) return;
              dragging=false;
              games.style.cursor='grab';
            }

            window.addEventListener('mouseup',stopDrag,true);
            window.addEventListener('blur',stopDrag);

            games.addEventListener('dragstart',function(e){e.preventDefault();},true);

            games.addEventListener('click',function(e){
              if(dragged){
                e.preventDefault();
                e.stopPropagation();
                dragged=false;
              }
            },true);
          })();
          </script>'''

          if '</body>' not in text:
              raise SystemExit('Could not find </body> in index.html')

          text=text.replace('</body>',patch+'\n</body>',1)
          path.write_text(text,encoding='utf-8')

      - name: Commit patched homepage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix desktop mobile preview drag with mouse events"
            git push
          fi
