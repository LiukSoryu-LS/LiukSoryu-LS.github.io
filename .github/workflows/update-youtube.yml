name: Update YouTube videos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-youtube.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  PODCAST_RSS: https://anchor.fm/s/116b74cd0/podcast/rss

jobs:
  update-site-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest YouTube uploads
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          try:
              req=urllib.request.Request('https://www.youtube.com/@liuksoryu/videos',headers={'User-Agent':'Mozilla/5.0'})
              html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
              channel_id=None
              for pattern in [r'\"channelId\":\"(UC[^\"]+)\"',r'\"externalId\":\"(UC[^\"]+)\"',r'channelId=(UC[A-Za-z0-9_-]+)']:
                  m=re.search(pattern,html)
                  if m:
                      channel_id=m.group(1); break
              if not channel_id:
                  raise RuntimeError('Could not resolve LIUKSORYU channel ID')
              xml=urllib.request.urlopen(f'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}',timeout=30).read()
              root=ET.fromstring(xml)
              ns={'yt':'http://www.youtube.com/xml/schemas/2015','atom':'http://www.w3.org/2005/Atom'}
              videos=[]
              for entry in root.findall('atom:entry',ns)[:5]:
                  vid=entry.findtext('yt:videoId',default='',namespaces=ns)
                  title=entry.findtext('atom:title',default='Untitled',namespaces=ns)
                  published=entry.findtext('atom:published',default='',namespaces=ns)
                  videos.append({'title':title,'url':f'https://www.youtube.com/watch?v={vid}','thumbnail':f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg','meta':f'YouTube • {published[:10]}' if published else 'YouTube'})
              Path('videos.json').write_text(json.dumps(videos,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print(f'Updated videos.json with {len(videos)} uploads.')
          except Exception as exc:
              print(f'::warning::YouTube fetch skipped; keeping existing videos.json: {exc}')
          PY

      - name: Sync all podcast episodes from RSS
        shell: bash
        run: |
          python3 - <<'PY'
          import html,re,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          rss_url='https://anchor.fm/s/116b74cd0/podcast/rss'
          target=Path('podcasts.html')
          text=target.read_text(encoding='utf-8')
          req=urllib.request.Request(rss_url,headers={'User-Agent':'Mozilla/5.0'})
          xml=urllib.request.urlopen(req,timeout=30).read()
          root=ET.fromstring(xml)
          channel=root.find('channel')
          items=channel.findall('item') if channel is not None else []
          if not items:
              raise RuntimeError('RSS feed returned no podcast episodes')
          def cdata_text(node, default=''):
              return ''.join(node.itertext()).strip() if node is not None else default
          episodes=[]
          for item in items:
              title=html.unescape(cdata_text(item.find('title'),'Untitled episode'))
              pub=item.findtext('pubDate','').strip()
              link=item.findtext('link','').strip()
              guid=item.findtext('guid','').strip()
              episodes.append((title,pub,link,guid))
          label='<div class="episode-label">LATEST EPISODES</div>'
          start=text.find(label)
          if start < 0:
              raise RuntimeError('Could not find LATEST EPISODES block in podcasts.html')
          end_match=re.search(r'</div>\s*<div><a class="listen"',text[start:])
          if not end_match:
              raise RuntimeError('Could not find end of episode list in podcasts.html')
          list_end=start+end_match.start()+len('</div>')
          prefix=text[:start]
          suffix=text[list_end:]
          buttons=[]
          for i,(title,pub,link,guid) in enumerate(episodes,1):
              safe_title=html.escape(title,quote=False)
              date_text=html.escape(pub[:16],quote=False) if pub else ''
              hint=f'{date_text} • Play this episode in the player above' if date_text else 'Play this episode in the player above'
              active=' active' if i==1 else ''
              episode_url=link or guid
              buttons.append(f'<button class="episode{active}" type="button" data-episode-url="{html.escape(episode_url,quote=True)}"><span class="episode-number">{i}</span><span class="episode-text"><span class="episode-name">{safe_title}</span><span class="episode-hint">{html.escape(hint,quote=False)}</span></span></button>')
          new_block=label+'\n'+'\n'.join(buttons)+'\n'
          target.write_text(prefix+new_block+suffix,encoding='utf-8')
          print(f'Synced {len(episodes)} podcast episodes from RSS.')
          PY

      - name: Ensure Podcasts guide links to dedicated page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<h3>PODCASTS</h3>'
          pos=s.find(marker)
          if pos < 0:
              raise SystemExit('Could not find PODCASTS card')
          start=s.rfind('<a ',0,pos)
          end=s.find('</a>',pos)
          if start < 0 or end < 0:
              raise SystemExit('Could not isolate PODCASTS card')
          card=s[start:end+4]
          replacement=re.sub(r'(<a\b[^>]*\bhref=")[^"]*(")',r'\1podcasts.html\2',card,count=1)
          if replacement!=card:
              s=s[:start]+replacement+s[end+4:]
              p.write_text(s,encoding='utf-8')
              print('PODCASTS card now points to podcasts.html')
          else:
              print('PODCASTS card already points to podcasts.html')
          PY

      - name: Ensure Podcasts card uses Lore artwork
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'(<div class="guide-icon">).*?(</div><h3>PODCASTS</h3>)'
          replacement=r'\1<img src="Lore.png" alt="Lore podcast artwork" style="width:72px;height:72px;object-fit:contain;display:block">\2'
          s2=re.sub(pattern,replacement,s,count=1,flags=re.S)
          if s2==s and 'src="Lore.png" alt="Lore podcast artwork"' not in s:
              raise SystemExit('Could not find PODCASTS card icon')
          p.write_text(s2,encoding='utf-8')
          print('PODCASTS card artwork verified.')
          PY

      - name: Ensure Stream Suggestions card uses Boba artwork
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<h3>STREAM SUGGESTIONS</h3>'
          pos=s.find(marker)
          if pos < 0:
              raise SystemExit('Could not find STREAM SUGGESTIONS card')
          start=s.rfind('<a ',0,pos)
          end=s.find('</a>',pos)
          if start < 0 or end < 0:
              raise SystemExit('Could not isolate STREAM SUGGESTIONS card')
          card=s[start:end+4]
          card=re.sub(r'(<a\b[^>]*\bhref=")[^"]*(")',r'\1stream-suggestions.html\2',card,count=1)
          card2=re.sub(r'(<div class="guide-icon">).*?(</div><h3>STREAM SUGGESTIONS</h3>)',r'\1<img src="bobas friends.png" alt="Boba\'s Friends artwork" style="width:72px;height:72px;object-fit:contain;display:block">\2',card,count=1,flags=re.S)
          if card2==card and 'src="bobas friends.png" alt="Boba\'s Friends artwork"' not in card:
              raise SystemExit('Could not set Boba artwork on STREAM SUGGESTIONS card')
          if card2!=card:
              s=s[:start]+card2+s[end+4:]
              p.write_text(s,encoding='utf-8')
              print('STREAM SUGGESTIONS card now uses Boba artwork.')
          else:
              print('STREAM SUGGESTIONS card artwork/link already correct.')
          PY

      - name: Verify homepage special-card links and artwork
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['podcasts.html','Lore.png','stream-suggestions.html','bobas friends.png','mobilePreviewToggle','mobilePreviewOverlay']
          for needle in required:
              if needle not in s:
                  raise SystemExit(f'Missing homepage element: {needle}')
          print('Homepage links, artwork and mobile preview verified.')
          PY

      - name: Commit generated content only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos.json podcasts.html index.html
          if git diff --cached --quiet; then
            echo 'No generated-content changes.'
          else
            git commit -m 'Sync YouTube, podcast and guide content [skip ci]'
            git push
          fi
