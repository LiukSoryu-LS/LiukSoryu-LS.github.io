name: Update YouTube videos

on:
  push:
    branches: [main]
    paths-ignore:
      - videos.json
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest YouTube uploads
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          req=urllib.request.Request('https://www.youtube.com/@liuksoryu/videos',headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          channel_id=None
          for pattern in [r'"channelId":"(UC[^"]+)"',r'"externalId":"(UC[^"]+)"',r'channelId=(UC[A-Za-z0-9_-]+)']:
              m=re.search(pattern,html)
              if m:
                  channel_id=m.group(1); break
          if not channel_id: raise SystemExit('Could not resolve LIUKSORYU channel ID')
          xml=urllib.request.urlopen(f'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}',timeout=30).read()
          root=ET.fromstring(xml)
          ns={'yt':'http://www.youtube.com/xml/schemas/2015','atom':'http://www.w3.org/2005/Atom'}
          videos=[]
          for entry in root.findall('atom:entry',ns)[:5]:
              vid=entry.findtext('yt:videoId',default='',namespaces=ns)
              title=entry.findtext('atom:title',default='Untitled',namespaces=ns)
              published=entry.findtext('atom:published',default='',namespaces=ns)
              videos.append({'title':title,'url':f'https://www.youtube.com/watch?v={vid}','thumbnail':f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg','meta':f'YouTube • {published[:10]}' if published else 'YouTube'})
          Path('videos.json').write_text(json.dumps(videos,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Restore YouTube and Bilibili artwork without altering other buttons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* LIUKSORYU SOCIAL ICON ARTWORK LOCK V6 */'
          css='''<style>/* LIUKSORYU SOCIAL ICON ARTWORK LOCK V6 */
          /* Never recolor SVG children globally: YouTube is intentionally two-tone. */
          a.social[href*="youtube.com"] svg{width:20px!important;height:20px!important;display:block!important}
          a.social[href*="youtube.com"] svg rect{fill:#fff!important;stroke:none!important;opacity:1!important;visibility:visible!important}
          a.social[href*="youtube.com"] svg path{fill:#130d28!important;stroke:none!important;opacity:1!important;visibility:visible!important}
          a.social[href*="youtube.com"] svg *{stroke:none!important}
          a.social[href*="bilibili.com"] svg{width:20px!important;height:20px!important;display:block!important}
          a.social[href*="bilibili.com"] svg path{fill:#fff!important;stroke:none!important;opacity:1!important;visibility:visible!important}
          </style>'''
          if marker not in s:
              i=s.find('</style>')
              if i<0: raise SystemExit('Could not find homepage style block')
              s=s[:i]+css+s[i:]
          p.write_text(s,encoding='utf-8')
          print('Installed V6 targeted YouTube/Bilibili artwork rules.')
          PY

      - name: Commit generated updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html videos.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Fix YouTube icon artwork [skip ci]'
            git push
          fi
