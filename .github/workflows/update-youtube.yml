name: Update YouTube videos

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest YouTube uploads
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          req=urllib.request.Request('https://www.youtube.com/@liuksoryu/videos',headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          channel_id=None
          for pattern in [r'"channelId":"(UC[^"]+)"',r'"externalId":"(UC[^"]+)"',r'channelId=(UC[A-Za-z0-9_-]+)']:
              m=re.search(pattern,html)
              if m:
                  channel_id=m.group(1); break
          if not channel_id: raise SystemExit('Could not resolve LIUKSORYU channel ID')
          xml=urllib.request.urlopen(f'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}',timeout=30).read()
          root=ET.fromstring(xml)
          ns={'yt':'http://www.youtube.com/xml/schemas/2015','atom':'http://www.w3.org/2005/Atom'}
          videos=[]
          for entry in root.findall('atom:entry',ns)[:5]:
              vid=entry.findtext('yt:videoId',default='',namespaces=ns)
              title=entry.findtext('atom:title',default='Untitled',namespaces=ns)
              published=entry.findtext('atom:published',default='',namespaces=ns)
              videos.append({'title':title,'url':f'https://www.youtube.com/watch?v={vid}','thumbnail':f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg','meta':f'YouTube • {published[:10]}' if published else 'YouTube'})
          Path('videos.json').write_text(json.dumps(videos,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Patch mobile footer spacing in place
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='/* LIUKSORYU MOBILE FOOTER SPACING V2 */'
          # Remove prior versions of this footer-only patch, but leave all other homepage CSS untouched.
          s=re.sub(r'<style>/\* LIUKSORYU MOBILE FOOTER SPACING V[0-9]+ \*/.*?</style>','',s,flags=re.S)
          patch='''<style>/* LIUKSORYU MOBILE FOOTER SPACING V2 */
          @media(max-width:600px){
            .footer{padding-top:42px!important;padding-bottom:34px!important}
            .footer-inner{gap:28px!important}
            .footer-brand{width:100%!important;gap:18px!important}
            .footer-brand>img{width:150px!important;height:58px!important;object-fit:contain!important;display:block!important;margin:0 0 2px 0!important}
            .footer-copy{font-size:11px!important;line-height:1.85!important;margin:0!important}
            .footer-right{width:100%!important;gap:24px!important;align-items:flex-start!important}
            .footer-socials{gap:12px!important;margin:0!important;padding:0!important}
            .footer-social{width:46px!important;height:46px!important;flex:0 0 46px!important}
            .footer-links{gap:20px!important;line-height:1.9!important;margin:0!important;padding:0!important}
          }
          </style>'''
          # Put the patch immediately before </head>; it is isolated to mobile footer spacing.
          i=s.find('</head>')
          if i<0: raise SystemExit('Could not find </head> in index.html')
          s=s[:i]+patch+s[i:]
          p.write_text(s,encoding='utf-8')
          print('Mobile footer spacing V2 installed.')
          PY

      - name: Commit generated data and mobile spacing
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos.json index.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Improve mobile footer spacing [skip ci]'
            git push
          fi
