name: Update YouTube videos

on:
  push:
    branches: [main]
    paths-ignore:
      - videos.json
      - playlist-thumbnails.json
      - .github/workflows/update-youtube.yml
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest YouTube uploads
        run: |
          python - <<'PY'
          import json, re, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          CHANNEL = 'https://www.youtube.com/@liuksoryu/videos'
          req = urllib.request.Request(CHANNEL, headers={'User-Agent':'Mozilla/5.0'})
          page = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'ignore')
          channel_id = None
          for pattern in [r'"channelId":"(UC[^"]+)"', r'"externalId":"(UC[^"]+)"', r'channelId=(UC[A-Za-z0-9_-]+)']:
              m = re.search(pattern, page)
              if m:
                  channel_id = m.group(1)
                  break
          if not channel_id:
              raise SystemExit('Could not resolve the LIUKSORYU YouTube channel ID.')
          feed_url = f'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}'
          xml = urllib.request.urlopen(urllib.request.Request(feed_url, headers={'User-Agent':'Mozilla/5.0'}), timeout=30).read()
          root = ET.fromstring(xml)
          ns = {'yt':'http://www.youtube.com/xml/schemas/2015', 'atom':'http://www.w3.org/2005/Atom'}
          videos = []
          for entry in root.findall('atom:entry', ns)[:5]:
              vid = entry.findtext('yt:videoId', default='', namespaces=ns)
              title = entry.findtext('atom:title', default='Untitled', namespaces=ns)
              published = entry.findtext('atom:published', default='', namespaces=ns)
              link = entry.find('atom:link', ns)
              url = link.attrib.get('href') if link is not None else f'https://www.youtube.com/watch?v={vid}'
              thumb = f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg'
              date = published[:10] if published else ''
              videos.append({'title': title, 'url': url, 'thumbnail': thumb, 'meta': f'YouTube • {date}' if date else 'YouTube'})
          Path('videos.json').write_text(json.dumps(videos, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Updated {len(videos)} latest videos from {channel_id}')
          PY

      - name: Connect latest videos to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'data-video-card' not in s:
              start = s.index('<div class="videos">')
              end = s.index('</div></div></section>', start)
              block = '<div class="videos">' + ''.join('<a class="card video" data-video-card href="#" target="_blank" rel="noopener"><div class="image-slot"><span class="play">▶</span></div><div class="video-info"><div class="video-title">Loading latest video…</div><div class="video-meta">YouTube</div></div></a>' for _ in range(5))
              s = s[:start] + block + s[end:]
          if 'loadLatestVideos' not in s:
              needle = "<script>document.addEventListener('dragstart',e=>e.preventDefault());"
              script = '''<script>async function loadLatestVideos(){try{const r=await fetch('videos.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('videos.json unavailable');const videos=await r.json();document.querySelectorAll('[data-video-card]').forEach((card,i)=>{const v=videos[i];if(!v){card.style.display='none';return;}card.style.display='';card.href=v.url;card.querySelector('.video-title').textContent=v.title;card.querySelector('.video-meta').textContent=v.meta||'YouTube';card.querySelector('.image-slot').style.backgroundImage=`url("${v.thumbnail}")`;card.querySelector('.image-slot').style.backgroundSize='cover';card.querySelector('.image-slot').style.backgroundPosition='center';card.querySelector('.image-slot').style.backgroundRepeat='no-repeat';});}catch(e){console.warn('Latest videos could not be loaded:',e)}}loadLatestVideos();document.addEventListener('dragstart',e=>e.preventDefault());'''
              s = s.replace(needle, script)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Update Games playlist thumbnails
        run: |
          python - <<'PY'
          import html as htmlmod, json, re, urllib.request
          from pathlib import Path
          playlists = [
              ('Wuthering Waves Lore — Podcast', 'https://youtube.com/playlist?list=PLSjzzcfb3AwA'),
              ('Genshin Impact', 'https://youtube.com/playlist?list=PL3gT64ipuP2Q4oL7gny6-uQTKGX6vrA9h'),
              ('Zenless Zone Zero (ZZZ)', 'https://youtube.com/playlist?list=PL3gT64ipuP2TJ-7CqMaOkUabLrfCJ112_'),
              ('Wuthering Waves', 'https://youtube.com/playlist?list=PLBU_IiYBDS9c'),
              ('Reverse: 1999', 'https://youtube.com/playlist?list=PL3gT64ipuP2S-_KTvJ0oJDdQIDpuDGAwq'),
              ('NTE', 'https://youtube.com/playlist?list=PLRiUfBOoP20M'),
              ('Chaos Zero Nightmare', 'https://youtube.com/playlist?list=PLHqebmkOvcn4'),
              ('Arknights: Endfield', 'https://youtube.com/playlist?list=PLNf6kMa6gAa8'),
              ('Honkai Star Rail', 'https://youtube.com/playlist?list=PLH_i2bw4m1HI'),
              ('And More To Come…', '#'),
          ]
          state_path=Path('playlist-thumbnails.json')
          try: state=json.loads(state_path.read_text(encoding='utf-8'))
          except Exception: state={}
          old_html=Path('index.html').read_text(encoding='utf-8')
          def current_image(title):
              t=re.escape(htmlmod.escape(title))
              m=re.search(r'<a class="card game-card"[^>]*>\s*<div class="image-slot has-image"><img src="([^"]+)"[^>]*alt="'+t+r'"', old_html)
              return m.group(1) if m else None
          def playlist_video_ids(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              data=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
              ids=re.findall(r'"playlistVideoRenderer"\s*:\s*\{.*?"videoId"\s*:\s*"([A-Za-z0-9_-]{11})"',data,re.S)
              if not ids:
                  ids=re.findall(r'"videoId"\s*:\s*"([A-Za-z0-9_-]{11})"',data)
              out=[]
              for vid in ids:
                  if vid not in out: out.append(vid)
              return out
          cards=[]
          for title,url in playlists:
              if url=='#':
                  image='<div class="image-slot"></div>'
              else:
                  key=url.split('list=')[-1]
                  try:
                      ids=playlist_video_ids(url)
                      previous=state.get(key,{})
                      known=set(previous.get('known',[]))
                      new_ids=[vid for vid in ids if vid not in known]
                      if new_ids:
                          selected=new_ids[-1]
                      else:
                          selected=previous.get('selected') if previous.get('selected') in ids else (ids[0] if ids else None)
                      if ids:
                          state[key]={'selected':selected,'known':ids}
                      if selected:
                          image=f'<div class="image-slot has-image"><img src="https://i.ytimg.com/vi/{selected}/hqdefault.jpg" alt="{htmlmod.escape(title)}" loading="lazy"></div>'
                      else:
                          old=current_image(title)
                          image=f'<div class="image-slot has-image"><img src="{old}" alt="{htmlmod.escape(title)}" loading="lazy"></div>' if old else '<div class="image-slot"></div>'
                  except Exception as exc:
                      print(f'Could not refresh {title}: {exc}')
                      old=current_image(title)
                      image=f'<div class="image-slot has-image"><img src="{old}" alt="{htmlmod.escape(title)}" loading="lazy"></div>' if old else '<div class="image-slot"></div>'
              cards.append(f'<a class="card game-card" href="{url}" target="_blank" rel="noopener">{image}<div class="game-name">{htmlmod.escape(title)}</div></a>')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<div class="games">')
          end=s.index('</div></div></div></section>',start)+len('</div>')
          s=s[:start]+'<div class="games">'+''.join(cards)+'</div>'+s[end:]
          p.write_text(s,encoding='utf-8')
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html videos.json playlist-thumbnails.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update YouTube videos and playlist thumbnails [skip ci]'
            git push
          fi
