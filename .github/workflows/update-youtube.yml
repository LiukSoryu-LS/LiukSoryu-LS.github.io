name: Update YouTube videos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-youtube.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest YouTube uploads
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          req=urllib.request.Request('https://www.youtube.com/@liuksoryu/videos',headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          channel_id=None
          for pattern in [r'"channelId":"(UC[^"]+)"',r'"externalId":"(UC[^"]+)"',r'channelId=(UC[A-Za-z0-9_-]+)']:
              m=re.search(pattern,html)
              if m:
                  channel_id=m.group(1); break
          if not channel_id: raise SystemExit('Could not resolve LIUKSORYU channel ID')
          xml=urllib.request.urlopen(f'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}',timeout=30).read()
          root=ET.fromstring(xml)
          ns={'yt':'http://www.youtube.com/xml/schemas/2015','atom':'http://www.w3.org/2005/Atom'}
          videos=[]
          for entry in root.findall('atom:entry',ns)[:5]:
              vid=entry.findtext('yt:videoId',default='',namespaces=ns)
              title=entry.findtext('atom:title',default='Untitled',namespaces=ns)
              published=entry.findtext('atom:published',default='',namespaces=ns)
              videos.append({'title':title,'url':f'https://www.youtube.com/watch?v={vid}','thumbnail':f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg','meta':f'YouTube • {published[:10]}' if published else 'YouTube'})
          Path('videos.json').write_text(json.dumps(videos,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Fix mobile header and footer layout only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove only the mobile footer patches previously generated by this workflow.
          s=re.sub(r'<style>/\* LIUKSORYU MOBILE FOOTER SPACING V[0-9]+ \*/.*?</style>','',s,flags=re.S)
          s=re.sub(r'<style>/\* LIUKSORYU MOBILE FOOTER FINAL SPACING \*/.*?</style>','',s,flags=re.S)
          s=re.sub(r'<style>/\* LIUKSORYU MOBILE FOOTER FINAL \*/.*?</style>','',s,flags=re.S)
          patch='''<style>/* LIUKSORYU MOBILE HEADER + FOOTER FINAL */
          @media (max-width:600px){
            /* Header social buttons: force true squares; never allow flex/grid stretching. */
            .topbar .socials{display:flex!important;flex:0 0 auto!important;gap:10px!important;align-items:center!important}
            .topbar .social{width:44px!important;height:44px!important;min-width:44px!important;max-width:44px!important;min-height:44px!important;max-height:44px!important;flex:0 0 44px!important;aspect-ratio:1/1!important;box-sizing:border-box!important;display:grid!important;place-items:center!important;padding:0!important}
            .topbar .social svg{width:20px!important;height:20px!important;max-width:20px!important;max-height:20px!important;display:block!important}
            /* Footer: clear vertical separation between each content group. */
            .footer{padding:48px 0 38px!important}
            .footer-inner{display:flex!important;flex-direction:column!important;align-items:flex-start!important;gap:0!important}
            .footer-brand{width:100%!important;display:flex!important;flex-direction:column!important;align-items:flex-start!important;gap:22px!important}
            .footer-brand>img{width:150px!important;height:58px!important;display:block!important;object-fit:contain!important;margin:0!important}
            .footer-copy{margin:0!important;line-height:1.9!important}
            .footer-right{width:100%!important;display:flex!important;flex-direction:column!important;align-items:flex-start!important;gap:0!important;margin:0!important}
            .footer-socials{display:flex!important;gap:14px!important;margin:28px 0 0!important;padding:0!important;flex-wrap:nowrap!important}
            .footer-social{width:46px!important;height:46px!important;min-width:46px!important;max-width:46px!important;min-height:46px!important;max-height:46px!important;flex:0 0 46px!important;aspect-ratio:1/1!important}
            .footer-links{display:flex!important;gap:22px!important;align-items:center!important;margin:30px 0 0!important;padding:0!important;line-height:1.9!important;flex-wrap:wrap!important}
          }
          </style>'''
          i=s.find('</head>')
          if i<0: raise SystemExit('Could not find </head>')
          s=s[:i]+patch+s[i:]
          p.write_text(s,encoding='utf-8')
          print('Installed final mobile header square-button and footer spacing patch.')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos.json index.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Fix mobile header buttons and footer spacing [skip ci]'
            git push
          fi
