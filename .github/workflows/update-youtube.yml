name: Update YouTube videos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-youtube.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest YouTube uploads
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          req=urllib.request.Request('https://www.youtube.com/@liuksoryu/videos',headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          channel_id=None
          for pattern in [r'"channelId":"(UC[^"]+)"',r'"externalId":"(UC[^"]+)"',r'channelId=(UC[A-Za-z0-9_-]+)']:
              m=re.search(pattern,html)
              if m:
                  channel_id=m.group(1); break
          if not channel_id: raise SystemExit('Could not resolve LIUKSORYU channel ID')
          xml=urllib.request.urlopen(f'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}',timeout=30).read()
          root=ET.fromstring(xml)
          ns={'yt':'http://www.youtube.com/xml/schemas/2015','atom':'http://www.w3.org/2005/Atom'}
          videos=[]
          for entry in root.findall('atom:entry',ns)[:5]:
              vid=entry.findtext('yt:videoId',default='',namespaces=ns)
              title=entry.findtext('atom:title',default='Untitled',namespaces=ns)
              published=entry.findtext('atom:published',default='',namespaces=ns)
              videos.append({'title':title,'url':f'https://www.youtube.com/watch?v={vid}','thumbnail':f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg','meta':f'YouTube • {published[:10]}' if published else 'YouTube'})
          Path('videos.json').write_text(json.dumps(videos,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Clean malformed legacy style wrappers and fix mobile layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # The old social-artwork fixes were accidentally nested as literal <style> tags
          # inside the original head stylesheet. Remove that legacy block and close the
          # original stylesheet cleanly before the current mobile patch.
          s=re.sub(
              r'<style>/\* LIUKSORYU social button interaction V1 \*/.*?(?=<style>/\* LIUKSORYU MOBILE HEADER \+ FOOTER FINAL \*/)',
              '</style>',
              s,
              flags=re.S
          )

          # Remove previous workflow-generated mobile patches before installing one clean patch.
          s=re.sub(r'<style>/\* LIUKSORYU MOBILE HEADER \+ FOOTER FINAL \*/.*?</style>', '', s, flags=re.S)
          s=re.sub(r'<style>/\* LIUKSORYU MOBILE FOOTER(?: SPACING V[0-9]+| FINAL SPACING| FINAL) \*/.*?</style>', '', s, flags=re.S)

          patch='''<style>/* LIUKSORYU MOBILE LAYOUT — CLEAN */
          @media (max-width:600px){
            /* Header: fixed square social buttons. No stretch, no inherited minimum height. */
            .topbar .socials{
              display:flex!important;
              flex:0 0 auto!important;
              width:auto!important;
              height:44px!important;
              min-height:44px!important;
              max-height:44px!important;
              gap:10px!important;
              align-items:center!important;
            }
            .topbar .socials .social{
              box-sizing:border-box!important;
              display:grid!important;
              place-items:center!important;
              width:44px!important;
              height:44px!important;
              min-width:44px!important;
              max-width:44px!important;
              min-height:44px!important;
              max-height:44px!important;
              flex:0 0 44px!important;
              align-self:center!important;
              padding:0!important;
              margin:0!important;
              line-height:0!important;
              overflow:hidden!important;
              aspect-ratio:1 / 1!important;
            }
            .topbar .socials .social svg{
              width:20px!important;
              height:20px!important;
              min-width:20px!important;
              max-width:20px!important;
              min-height:20px!important;
              max-height:20px!important;
              display:block!important;
              flex:none!important;
            }

            /* Footer: deliberate vertical separation between logo, copy, socials and links. */
            .footer{padding:48px 0 40px!important}
            .footer-inner{
              display:flex!important;
              flex-direction:column!important;
              align-items:flex-start!important;
              justify-content:flex-start!important;
              gap:40px!important;
            }
            .footer-brand{
              width:100%!important;
              display:flex!important;
              flex-direction:column!important;
              align-items:flex-start!important;
              gap:22px!important;
            }
            .footer-brand>img{
              width:150px!important;
              height:58px!important;
              display:block!important;
              object-fit:contain!important;
              margin:0!important;
            }
            .footer-copy{
              margin:0!important;
              line-height:1.9!important;
            }
            .footer-right{
              width:100%!important;
              display:flex!important;
              flex-direction:column!important;
              align-items:flex-start!important;
              gap:36px!important;
              margin:0!important;
            }
            .footer-socials{
              display:flex!important;
              align-items:center!important;
              flex-wrap:nowrap!important;
              gap:14px!important;
              margin:0!important;
              padding:0!important;
            }
            .footer-social{
              box-sizing:border-box!important;
              width:46px!important;
              height:46px!important;
              min-width:46px!important;
              max-width:46px!important;
              min-height:46px!important;
              max-height:46px!important;
              flex:0 0 46px!important;
              aspect-ratio:1 / 1!important;
              display:grid!important;
              place-items:center!important;
              margin:0!important;
              padding:0!important;
              overflow:hidden!important;
              line-height:0!important;
            }
            .footer-social svg{
              width:20px!important;
              height:20px!important;
              min-width:20px!important;
              max-width:20px!important;
              min-height:20px!important;
              max-height:20px!important;
              display:block!important;
              flex:none!important;
            }
            .footer-links{
              display:flex!important;
              align-items:center!important;
              flex-wrap:wrap!important;
              gap:22px!important;
              margin:0!important;
              padding:0!important;
              line-height:1.9!important;
            }
          }
          </style>'''
          i=s.find('</head>')
          if i<0: raise SystemExit('Could not find </head> in index.html')
          s=s[:i]+patch+s[i:]
          p.write_text(s,encoding='utf-8')
          print('Cleaned legacy style wrappers and installed one isolated mobile layout patch.')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos.json index.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Clean mobile layout CSS [skip ci]'
            git push
          fi
