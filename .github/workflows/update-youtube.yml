name: Update YouTube videos

on:
  push:
    branches: [main]
    paths-ignore:
      - videos.json
      - playlist-thumbnails.json
      - .github/workflows/update-youtube.yml
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest YouTube uploads
        run: |
          python - <<'PY'
          import json, re, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          req = urllib.request.Request('https://www.youtube.com/@liuksoryu/videos', headers={'User-Agent':'Mozilla/5.0'})
          html = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'ignore')
          channel_id = None
          for pattern in [r'"channelId":"(UC[^"]+)"', r'"externalId":"(UC[^"]+)"', r'channelId=(UC[A-Za-z0-9_-]+)']:
              m = re.search(pattern, html)
              if m:
                  channel_id = m.group(1)
                  break
          if not channel_id:
              raise SystemExit('Could not resolve LIUKSORYU channel ID')
          xml = urllib.request.urlopen(f'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}', timeout=30).read()
          root = ET.fromstring(xml)
          ns = {'yt':'http://www.youtube.com/xml/schemas/2015', 'atom':'http://www.w3.org/2005/Atom'}
          videos=[]
          for entry in root.findall('atom:entry',ns)[:5]:
              vid=entry.findtext('yt:videoId',default='',namespaces=ns)
              title=entry.findtext('atom:title',default='Untitled',namespaces=ns)
              published=entry.findtext('atom:published',default='',namespaces=ns)
              link=entry.find('atom:link',ns)
              url=link.attrib.get('href') if link is not None else f'https://www.youtube.com/watch?v={vid}'
              videos.append({'title':title,'url':url,'thumbnail':f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg','meta':f'YouTube • {published[:10]}' if published else 'YouTube'})
          Path('videos.json').write_text(json.dumps(videos,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'Updated {len(videos)} latest channel videos')
          PY

      - name: Connect latest videos to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'data-video-card' not in s:
              raise SystemExit('Expected video cards are missing from index.html')
          if 'loadLatestVideos' not in s:
              needle="<script>document.addEventListener('dragstart',e=>e.preventDefault());"
              script='''<script>async function loadLatestVideos(){try{const r=await fetch('videos.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('videos.json unavailable');const videos=await r.json();document.querySelectorAll('[data-video-card]').forEach((card,i)=>{const v=videos[i];if(!v){card.style.display='none';return;}card.style.display='';card.href=v.url;card.querySelector('.video-title').textContent=v.title;card.querySelector('.video-meta').textContent=v.meta||'YouTube';const slot=card.querySelector('.image-slot');slot.style.backgroundImage=`url(\"${v.thumbnail}\")`;slot.style.backgroundSize='cover';slot.style.backgroundPosition='center';slot.style.backgroundRepeat='no-repeat';});}catch(e){console.warn('Latest videos could not be loaded:',e)}}loadLatestVideos();document.addEventListener('dragstart',e=>e.preventDefault());'''
              s=s.replace(needle,script)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Update Games playlist thumbnails
        run: |
          python - <<'PY'
          import html, json, re, urllib.request
          from pathlib import Path
          playlists=[
            ('Wuthering Waves Lore — Podcast','https://youtube.com/playlist?list=PLSjzzcfb3AwA'),
            ('Genshin Impact','https://youtube.com/playlist?list=PL3gT64ipuP2Q4oL7gny6-uQTKGX6vrA9h'),
            ('Zenless Zone Zero (ZZZ)','https://youtube.com/playlist?list=PL3gT64ipuP2TJ-7CqMaOkUabLrfCJ112_'),
            ('Wuthering Waves','https://youtube.com/playlist?list=PLBU_IiYBDS9c'),
            ('Reverse: 1999','https://youtube.com/playlist?list=PL3gT64ipuP2S-_KTvJ0oJDdQIDpuDGAwq'),
            ('NTE','https://youtube.com/playlist?list=PLRiUfBOoP20M'),
            ('Chaos Zero Nightmare','https://youtube.com/playlist?list=PLHqebmkOvcn4'),
            ('Arknights: Endfield','https://youtube.com/playlist?list=PLNf6kMa6gAa8'),
            ('Honkai Star Rail','https://youtube.com/playlist?list=PLH_i2bw4m1HI'),
            ('And More To Come…','#')]
          state_path=Path('playlist-thumbnails.json')
          state=json.loads(state_path.read_text(encoding='utf-8')) if state_path.exists() else {}
          new_state={}
          def ids_for(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              data=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
              ids=re.findall(r'\"playlistVideoRenderer\"\s*:\s*\{.*?\"videoId\"\s*:\s*\"([A-Za-z0-9_-]{11})\"',data,re.S)
              if not ids: ids=re.findall(r'\"videoId\"\s*:\s*\"([A-Za-z0-9_-]{11})\"',data)
              return list(dict.fromkeys(ids))
          def published_at(video_id):
              url=f'https://www.youtube.com/watch?v={video_id}'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              data=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
              for pattern in [r'\"datePublished\"\s*:\s*\"(\d{4}-\d{2}-\d{2}T[^\"]+)\"',r'\"publishDate\"\s*:\s*\"(\d{4}-\d{2}-\d{2})\"',r'\"uploadDate\"\s*:\s*\"(\d{4}-\d{2}-\d{2}T[^\"]+)\"']:
                  m=re.search(pattern,data)
                  if m: return m.group(1)
              return ''
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          for title,url in playlists:
              if url=='#': continue
              ids=ids_for(url)
              if not ids:
                  print(f'No videos found for {title}; preserving current card')
                  continue
              old=state.get(url,{})
              dates=old.get('published_at',{})
              for video_id in ids:
                  if video_id not in dates:
                      try:
                          dates[video_id]=published_at(video_id)
                      except Exception as e:
                          print(f'Could not read publish date for {title} / {video_id}: {e}')
                          dates[video_id]=''
              dated=[video_id for video_id in ids if dates.get(video_id)]
              if dated:
                  selected=max(dated,key=lambda video_id: dates[video_id])
              else:
                  selected=ids[0]
              new_state[url]={'known_ids':ids,'selected_id':selected,'published_at':dates,'title':title}
              thumb=f'https://i.ytimg.com/vi/{selected}/hqdefault.jpg'
              pattern=re.compile(r'<a class=\"card game-card\" href=\"'+re.escape(url)+r'\"[^>]*>.*?</a>',re.S)
              m=pattern.search(s)
              if not m:
                  print(f'Card not found for {title}; preserving existing HTML')
                  continue
              card=m.group(0)
              image=f'<div class=\"image-slot has-image\"><img src=\"{thumb}\" alt=\"{html.escape(title)}\" loading=\"lazy\"></div>'
              card=re.sub(r'<div class=\"image-slot(?: has-image)?\">.*?</div>',image,card,count=1,flags=re.S)
              s=s[:m.start()]+card+s[m.end():]
              print(f'{title}: {selected} ({dates.get(selected,"unknown date")})')
          state_path.write_text(json.dumps(new_state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Polish mobile presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='/* LIUKSORYU mobile polish */'
          if marker not in s:
              css='''\
/* LIUKSORYU mobile polish */\
@media(max-width:600px){html{scroll-padding-top:70px}body{overflow-x:hidden;-webkit-text-size-adjust:100%}.shell{width:calc(100% - 22px)}.topbar,.nav{height:64px}.nav{gap:7px}.brand{flex:1;min-width:0}.brand img{width:108px;height:52px}.links{display:none}.socials{gap:5px;flex:0 0 auto}.social{width:36px;height:36px;border-radius:11px}.social svg{width:18px;height:18px}.hero{min-height:590px;background-position:center center}.hero-content{width:100%;padding:54px 0 46px;margin-left:0;text-align:center}.eyebrow{font-size:10px;letter-spacing:.2em;margin-bottom:14px}.hero-logo{width:100%;height:auto;max-height:150px;object-position:center;margin:0 auto 16px}.hero p{max-width:100%;font-size:16px;line-height:1.52;margin:0 auto 22px}.actions{display:grid;grid-template-columns:1fr;gap:10px;width:100%}.btn{width:100%;min-height:52px;padding:14px 18px}.section{padding:26px 0 30px}.section-title{gap:10px}.section-title h2{font-size:20px;white-space:nowrap}.rule{max-width:70px}.section-sub{margin:7px 0 18px;font-size:9px;letter-spacing:.18em}.games{gap:10px;padding:2px 2px 10px;scroll-padding-left:2px;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}.games::-webkit-scrollbar{display:none}.games .card{flex:0 0 78%;min-width:0;scroll-snap-align:start}.games .card .image-slot{aspect-ratio:16/10}.game-name{font-size:13px;line-height:1.3;min-height:46px;display:grid;place-items:center;padding:9px 8px}.videos{grid-template-columns:1fr;gap:12px}.video .image-slot{aspect-ratio:16/9}.video-info{padding:11px}.video-title{font-size:14px;line-height:1.35}.video-meta{font-size:10px}.guides,.community{grid-template-columns:1fr;gap:12px}.guide-overlay{padding:16px}.community-card{min-height:76px;padding:14px}.community-icon{width:44px;height:44px}.footer{padding:24px 0}.footer-inner,.footer-brand{align-items:flex-start;flex-direction:column}.footer-brand{gap:12px}.footer-brand img{width:130px;height:44px}.footer-links{gap:12px;line-height:1.8}.card,.btn,.social,.community-card{-webkit-tap-highlight-color:transparent}.games .card,.video,.guide,.community-card,.btn,.social{min-height:48px}}\
@media(max-width:360px){.brand img{width:96px}.social{width:34px;height:34px}.social svg{width:17px;height:17px}.hero-content{padding-top:46px}.hero-logo{max-height:132px}.hero p{font-size:15px}.section-title h2{font-size:18px}.rule{max-width:48px}.games .card{flex-basis:84%}}\
@media(any-pointer:coarse){.btn,.social,.community-card,.games .card,.video,.guide{min-height:48px}}\
'''
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Ensure desktop mobile preview
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*/\* LIUKSORYU desktop mobile-view inspector(?: v2| FINAL)? \*/.*?(?=</style>)','',s,count=1,flags=re.S)
          s=re.sub(r'\s*<div id="mobilePreviewOverlay".*?<script>.*?</script>\s*</body>', '', s, count=1, flags=re.S)
          css='''\
/* LIUKSORYU desktop mobile preview */\
#mobilePreviewToggle{position:fixed!important;right:18px!important;bottom:18px!important;width:52px!important;height:52px!important;z-index:2147483646!important;border:2px solid transparent!important;border-radius:16px!important;display:grid!important;place-items:center!important;color:#fff!important;cursor:pointer!important;pointer-events:auto!important;background:linear-gradient(rgba(20,12,38,.96),rgba(20,12,38,.96)) padding-box,linear-gradient(110deg,#ef83ff,#b896ff,#7edcff) border-box!important;box-shadow:0 8px 24px rgba(0,0,0,.35)}\
#mobilePreviewToggle:hover{background:linear-gradient(110deg,#ef83ff,#b896ff,#7edcff) padding-box,linear-gradient(110deg,#ef83ff,#b896ff,#7edcff) border-box!important;color:#160b22!important;box-shadow:0 0 22px rgba(239,131,255,.4)}\
#mobilePreviewToggle svg{width:24px;height:24px;display:block;pointer-events:none}\
#mobilePreviewOverlay{position:fixed!important;inset:0!important;z-index:2147483645!important;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(4,2,12,.78);backdrop-filter:blur(8px)}\
body.mobile-preview-open{overflow:hidden}\
body.mobile-preview-open #mobilePreviewOverlay{display:flex}\
#mobilePreviewDevice{width:min(390px,calc(100vw - 48px));height:min(844px,calc(100vh - 48px));border:8px solid #171022;border-radius:34px;background:#000;box-shadow:0 0 0 2px #6f4b9e,0 25px 80px rgba(0,0,0,.65);overflow:hidden;position:relative}\
#mobilePreviewLabel{position:absolute;top:0;left:0;right:0;height:22px;z-index:2;background:rgba(12,7,24,.92);color:#d9c7ec;text-align:center;font:700 9px/22px system-ui,sans-serif;letter-spacing:.14em;pointer-events:none}\
#mobilePreviewFrame{position:absolute;left:0;top:22px;width:100%;height:calc(100% - 22px);border:0;background:#090615}\
@media(max-width:600px){#mobilePreviewToggle,#mobilePreviewOverlay{display:none!important}}\
'''
          s=s.replace('</style>',css+'</style>',1)
          controls='''\
<div id="mobilePreviewOverlay" aria-hidden="true"><div id="mobilePreviewDevice"><div id="mobilePreviewLabel">MOBILE PREVIEW</div><iframe id="mobilePreviewFrame" title="LIUKSORYU mobile preview"></iframe></div></div>\
<button id="mobilePreviewToggle" type="button" aria-label="Open mobile preview" title="Open mobile preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M10 5h4M11 18.5h2"/></svg></button>\
<script>\
(function(){\
  var button=document.getElementById('mobilePreviewToggle');\
  var overlay=document.getElementById('mobilePreviewOverlay');\
  var frame=document.getElementById('mobilePreviewFrame');\
  if(!button||!overlay||!frame)return;\
  if(new URLSearchParams(window.location.search).has('mobile-preview')){document.body.classList.add('mobile-preview-embedded');return;}\
  window.openMobilePreview=function(){\
    document.body.classList.add('mobile-preview-open');\
    overlay.setAttribute('aria-hidden','false');\
    if(!frame.src){var u=window.location.href.split('#')[0].split('?')[0];frame.src=u+'?mobile-preview=1';}\
  };\
  window.closeMobilePreview=function(){document.body.classList.remove('mobile-preview-open');overlay.setAttribute('aria-hidden','true');};\
  button.onclick=function(e){e.preventDefault();e.stopPropagation();if(document.body.classList.contains('mobile-preview-open'))window.closeMobilePreview();else window.openMobilePreview();};\
  overlay.onclick=function(e){if(e.target===overlay)window.closeMobilePreview();};\
  document.addEventListener('keydown',function(e){if(e.key==='Escape')window.closeMobilePreview();});\
})();\
</script>\
<script>\
(function(){\
  if(!new URLSearchParams(window.location.search).has('mobile-preview'))return;\
  function init(){\
    var games=document.querySelector('.games');\
    if(!games||games.dataset.dragFix==='v3')return;\
    games.dataset.dragFix='v3';\
    games.style.cursor='grab';\
    games.style.userSelect='none';\
    games.style.webkitUserSelect='none';\
    games.style.touchAction='pan-x';\
    var dragging=false,moved=false,startX=0,startScroll=0;\
    games.addEventListener('mousedown',function(e){\
      if(e.button!==0)return;\
      dragging=true;moved=false;startX=e.clientX;startScroll=games.scrollLeft;\
      games.style.cursor='grabbing';\
    });\
    window.addEventListener('mousemove',function(e){\
      if(!dragging)return;\
      var dx=e.clientX-startX;\
      if(Math.abs(dx)>3)moved=true;\
      if(moved)games.scrollLeft=startScroll-dx;\
      if(moved)e.preventDefault();\
    },true);\
    window.addEventListener('mouseup',function(){dragging=false;games.style.cursor='grab';},true);\
    games.addEventListener('dragstart',function(e){e.preventDefault();},true);\
    games.addEventListener('click',function(e){if(moved){e.preventDefault();e.stopImmediatePropagation();moved=false;}},true);\
  }\
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();\
})();\
</script>\
</body>'''
          s=s.replace('</body>',controls,1)
          p.write_text(s,encoding='utf-8')
          print('Desktop mobile preview implementation installed with desktop drag support.')
          PY

      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html videos.json playlist-thumbnails.json
          if git diff --cached --quiet; then echo 'No changes to commit.'; else git commit -m 'Update YouTube content and responsive presentation [skip ci]'; git push; fi
