name: Update YouTube videos

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest YouTube uploads
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          req=urllib.request.Request('https://www.youtube.com/@liuksoryu/videos',headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          channel_id=None
          for pattern in [r'"channelId":"(UC[^"]+)"',r'"externalId":"(UC[^"]+)"',r'channelId=(UC[A-Za-z0-9_-]+)']:
              m=re.search(pattern,html)
              if m:
                  channel_id=m.group(1); break
          if not channel_id: raise SystemExit('Could not resolve LIUKSORYU channel ID')
          xml=urllib.request.urlopen(f'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}',timeout=30).read()
          root=ET.fromstring(xml)
          ns={'yt':'http://www.youtube.com/xml/schemas/2015','atom':'http://www.w3.org/2005/Atom'}
          videos=[]
          for entry in root.findall('atom:entry',ns)[:5]:
              vid=entry.findtext('yt:videoId',default='',namespaces=ns)
              title=entry.findtext('atom:title',default='Untitled',namespaces=ns)
              published=entry.findtext('atom:published',default='',namespaces=ns)
              videos.append({'title':title,'url':f'https://www.youtube.com/watch?v={vid}','thumbnail':f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg','meta':f'YouTube • {published[:10]}' if published else 'YouTube'})
          Path('videos.json').write_text(json.dumps(videos,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Fix mobile footer spacing only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* LIUKSORYU MOBILE FOOTER SPACING V1 */'
          if marker not in s:
              css='''<style>/* LIUKSORYU MOBILE FOOTER SPACING V1 */
          @media(max-width:600px){
            .footer{padding-top:34px!important;padding-bottom:30px!important}
            .footer-inner{gap:22px!important}
            .footer-brand{gap:14px!important;width:100%!important}
            .footer-brand>img{width:150px!important;height:58px!important;object-fit:contain!important;margin-bottom:2px!important;display:block!important}
            .footer-copy{font-size:11px!important;line-height:1.8!important}
            .footer-right{width:100%!important;gap:20px!important;align-items:flex-start!important}
            .footer-socials{gap:10px!important;margin-top:2px!important;margin-bottom:4px!important}
            .footer-social{width:46px!important;height:46px!important}
            .footer-links{gap:18px!important;line-height:1.8!important}
          }
          </style>'''
              i=s.find('</style>')
              if i<0: raise SystemExit('Could not find homepage style block')
              s=s[:i]+css+s[i:]
              p.write_text(s,encoding='utf-8')
              print('Installed mobile footer spacing V1.')
          else:
              print('Mobile footer spacing V1 already present.')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos.json index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Improve mobile footer spacing [skip ci]'
            git push
          fi
