name: Update YouTube videos

on:
  push:
    branches: [main]
    paths-ignore:
      - videos.json
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest YouTube uploads
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          req=urllib.request.Request('https://www.youtube.com/@liuksoryu/videos',headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          channel_id=None
          for pattern in [r'"channelId":"(UC[^"]+)"',r'"externalId":"(UC[^"]+)"',r'channelId=(UC[A-Za-z0-9_-]+)']:
              m=re.search(pattern,html)
              if m:
                  channel_id=m.group(1); break
          if not channel_id: raise SystemExit('Could not resolve LIUKSORYU channel ID')
          xml=urllib.request.urlopen(f'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}',timeout=30).read()
          root=ET.fromstring(xml)
          ns={'yt':'http://www.youtube.com/xml/schemas/2015','atom':'http://www.w3.org/2005/Atom'}
          videos=[]
          for entry in root.findall('atom:entry',ns)[:5]:
              vid=entry.findtext('yt:videoId',default='',namespaces=ns)
              title=entry.findtext('atom:title',default='Untitled',namespaces=ns)
              published=entry.findtext('atom:published',default='',namespaces=ns)
              videos.append({'title':title,'url':f'https://www.youtube.com/watch?v={vid}','thumbnail':f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg','meta':f'YouTube • {published[:10]}' if published else 'YouTube'})
          Path('videos.json').write_text(json.dumps(videos,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Restore exact social icon artwork without changing layout
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          yt='''<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="#fff"/><path d="M10 9l5 3-5 3V9z" fill="#130d28"/></svg>'''
          bili='''<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M17.813 4.653h.854c1.51.054 2.769.578 3.773 1.574 1.004.995 1.524 2.249 1.56 3.76v7.36c-.036 1.51-.556 2.769-1.56 3.773s-2.262 1.524-3.773 1.56H5.333c-1.51-.036-2.769-.556-3.773-1.56S.036 18.858 0 17.347v-7.36c.036-1.511.556-2.765 1.56-3.76 1.004-.996 2.262-1.52 3.773-1.574h.774l-1.174-1.12a1.234 1.234 0 0 1-.373-.906c0-.356.124-.658.373-.907l.027-.027c.267-.249.573-.373.92-.373.347 0 .653.124.92.373L9.653 4.44c.071.071.134.142.187.213h4.267a.836.836 0 0 1 .16-.213l2.853-2.747c.267-.249.573-.373.92-.373.347 0 .662.151.929.4.267.249.391.551.391.907 0 .355-.124.657-.373.906zM5.333 7.24c-.746.018-1.373.276-1.88.773-.506.498-.769 1.13-.786 1.894v7.52c.017.764.28 1.395.786 1.893.507.498 1.134.756 1.88.773h13.334c.746-.017 1.373-.275 1.88-.773.506-.498.769-1.129.786-1.893v-7.52c-.017-.765-.28-1.396-.786-1.894-.507-.497-1.134-.755-1.88-.773zM8 11.107c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c0-.373.129-.689.386-.947.258-.257.574-.386.947-.386zm8 0c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c0-.373.129-.689.386-.947.258-.257.574-.386.947-.386z"/></svg>'''
          def replace_social(label, svg):
              pattern=re.compile(r'(<a\b[^>]*class=["\'][^"\']*\bsocial\b[^"\']*["\'][^>]*aria-label=["\']'+re.escape(label)+r'["\'][^>]*>)(.*?)(</a>)',re.I|re.S)
              def repl(m):
                  inner=re.sub(r'<svg\b.*?</svg>',svg,m.group(2),count=1,flags=re.I|re.S)
                  return m.group(1)+inner+m.group(3)
              return pattern.sub(repl,s)
          s=replace_social('YouTube',yt)
          s=replace_social('Bilibili',bili)
          marker='/* LIUKSORYU EXACT SOCIAL ARTWORK V7 */'
          if marker not in s:
              css='''<style>/* LIUKSORYU EXACT SOCIAL ARTWORK V7 */
          .social{color:#fff!important}.social:hover,.social:focus-visible,.social:active{color:#fff!important}
          .social[aria-label="YouTube"] svg{color:#fff!important}.social[aria-label="YouTube"] svg rect{fill:#fff!important;stroke:none!important}.social[aria-label="YouTube"] svg path{fill:#130d28!important;stroke:none!important}
          .social[aria-label="Bilibili"] svg{color:#fff!important}.social[aria-label="Bilibili"] svg path{fill:#fff!important;stroke:none!important}
          </style>'''
              i=s.find('</style>')
              if i<0: raise SystemExit('Could not find homepage style block')
              s=s[:i]+css+s[i:]
          p.write_text(s,encoding='utf-8')
          print('Restored exact YouTube and Bilibili social SVG artwork.')
          PY

      - name: Commit generated updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html videos.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Restore exact YouTube and Bilibili icon artwork [skip ci]'
            git push
          fi
