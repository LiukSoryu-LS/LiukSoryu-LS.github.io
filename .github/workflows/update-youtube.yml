name: Update YouTube videos

on:
  push:
    branches: [main]
    paths-ignore:
      - videos.json
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest YouTube uploads
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          req=urllib.request.Request('https://www.youtube.com/@liuksoryu/videos',headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          channel_id=None
          for pattern in [r'"channelId":"(UC[^"]+)"',r'"externalId":"(UC[^"]+)"',r'channelId=(UC[A-Za-z0-9_-]+)']:
              m=re.search(pattern,html)
              if m:
                  channel_id=m.group(1); break
          if not channel_id: raise SystemExit('Could not resolve LIUKSORYU channel ID')
          xml=urllib.request.urlopen(f'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}',timeout=30).read()
          root=ET.fromstring(xml)
          ns={'yt':'http://www.youtube.com/xml/schemas/2015','atom':'http://www.w3.org/2005/Atom'}
          videos=[]
          for entry in root.findall('atom:entry',ns)[:5]:
              vid=entry.findtext('yt:videoId',default='',namespaces=ns)
              title=entry.findtext('atom:title',default='Untitled',namespaces=ns)
              published=entry.findtext('atom:published',default='',namespaces=ns)
              videos.append({'title':title,'url':f'https://www.youtube.com/watch?v={vid}','thumbnail':f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg','meta':f'YouTube • {published[:10]}' if published else 'YouTube'})
          Path('videos.json').write_text(json.dumps(videos,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Ensure social buttons behave like the site's other interactive buttons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* LIUKSORYU social button interaction V1 */'
          if marker not in s:
              css='''<style>/* LIUKSORYU social button interaction V1 */
          .social,.footer-social{cursor:pointer;pointer-events:auto;transition:transform .2s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease;color:#fff;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
          .social:hover,.footer-social:hover{transform:translateY(-2px);background:linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box!important;border-color:transparent!important;box-shadow:0 0 18px rgba(239,131,255,.32),0 0 34px rgba(126,220,255,.14)!important;color:#160b22!important}
          .social:focus-visible,.footer-social:focus-visible{outline:2px solid #7edcff;outline-offset:3px}
          .social:active,.footer-social:active{transform:translateY(0) scale(.97)}
          </style>'''
              i=s.find('</style>')
              if i<0: raise SystemExit('Could not find homepage style block')
              s=s[:i]+css+s[i:]
              p.write_text(s,encoding='utf-8')
              print('Social button interaction installed.')
          else:
              print('Social button interaction already installed.')
          PY

      - name: Commit generated updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html videos.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Polish social button interactions [skip ci]'
            git push
          fi
