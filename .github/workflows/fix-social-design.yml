name: Refine social button design

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-social-design.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix social styling and Discord icon
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Keep Twitch icon white when its dark button is hovered.
          s=s.replace('.btn:hover{border-color:transparent;background:linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;box-shadow:0 0 20px rgba(239,131,255,.35),0 0 42px rgba(126,220,255,.18);color:#160b22}', '.btn:hover{border-color:transparent;background:linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;box-shadow:0 0 20px rgba(239,131,255,.35),0 0 42px rgba(126,220,255,.18);color:#160b22}.btn:not(.primary):hover .btn-icon{color:#fff}')

          # Make every Community card match the filled hero CTA structure.
          css='''.community-card{border:2px solid transparent;background:linear-gradient(110deg,#f18aff 0%,#a8a0ff 55%,#8bdcff 100%) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;color:#160b22}.community-card .community-icon{background:rgba(45,18,75,.94);color:#fff}.community-card .community-arrow{color:#160b22}.community-card:hover{border-color:transparent;background:linear-gradient(110deg,#f49aff 0%,#b7adff 55%,#9be5ff 100%) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;color:#160b22;box-shadow:0 0 22px rgba(239,131,255,.42),0 0 46px rgba(126,220,255,.2),0 12px 35px rgba(214,124,255,.3)}.community-card:hover .community-icon{color:#fff}.community-card h3{color:#160b22}.community-card p{color:#392653}.community-card .community-arrow{color:#160b22}'''
          if 'community-card{border:2px solid transparent;background:linear-gradient(110deg,#f18aff' not in s:
              s=s.replace('</style>',css+'</style>',1)

          # Replace the incorrect Discord path everywhere with the standard Discord mark.
          import re
          discord_path='M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515c-.213.38-.45.89-.616 1.293a18.27 18.27 0 0 0-5.632 0 13.66 13.66 0 0 0-.618-1.293A19.736 19.736 0 0 0 3.68 4.37C.533 9.046-.32 13.61.106 18.11a19.9 19.9 0 0 0 6.002 3.03c.49-.67.925-1.38 1.3-2.13a12.75 12.75 0 0 1-2.04-.98c.17-.126.337-.255.5-.386 3.93 1.84 8.18 1.84 12.063 0 .164.131.332.26.502.386-.65.374-1.33.702-2.04.98.376.75.81 1.46 1.3 2.13a19.9 19.9 0 0 0 6.002-3.03c.498-5.22-.85-9.74-3.378-13.74ZM8.02 15.33c-1.18 0-2.15-1.08-2.15-2.4s.95-2.4 2.15-2.4 2.17 1.08 2.15 2.4c0 1.32-.95 2.4-2.15 2.4Zm7.96 0c-1.18 0-2.15-1.08-2.15-2.4s.95-2.4 2.15-2.4 2.17 1.08 2.15 2.4c0 1.32-.95 2.4-2.15 2.4Z'
          s=re.sub(r'<a class="social" href="https://discord\.gg/DwHKtRMX2g".*?<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="[^"]+"/></svg>', lambda m: m.group(0).split('<path d="')[0]+'<path d="'+discord_path+'"/></svg>', s, count=1, flags=re.S)
          s=re.sub(r'(<a class="card community-card" href="https://discord\.gg/DwHKtRMX2g".*?<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d=")[^"]+("/></svg>)', r'\1'+discord_path+r'\2', s, count=1, flags=re.S)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-social-design.yml
          git commit -m 'Match community cards to hero CTA design and fix icons'
          git push