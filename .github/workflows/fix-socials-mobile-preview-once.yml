name: One-time social icon and mobile preview repair

on:
  push:
    branches: [fix-social-svg-rendering-lock]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Apply one-time social/mobile repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair header icons and restore mobile preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          marker='id="liuksoryu-header-icon-lock"'
          if marker not in s:
              css='''<style id="liuksoryu-header-icon-lock">.socials{display:flex!important;gap:8px!important;align-items:center!important}.socials .social{display:grid!important;visibility:visible!important;opacity:1!important;width:44px!important;height:44px!important;flex:0 0 44px!important;place-items:center!important;color:#fff!important}.socials .social svg{width:20px!important;height:20px!important;display:block!important;visibility:visible!important;opacity:1!important;overflow:visible!important;flex:none!important}.socials .social[aria-label="YouTube"] svg rect{fill:#fff!important}.socials .social[aria-label="YouTube"] svg path{fill:#130d28!important}.socials .social[aria-label="Twitch"] svg path,.socials .social[aria-label="Discord"] svg path,.socials .social[aria-label="X"] svg path{fill:#fff!important;stroke:none!important}@media(max-width:900px){.socials .social{display:grid!important;visibility:visible!important;opacity:1!important}.socials .social[aria-label="X"]{display:grid!important}}@media(max-width:600px){.socials{gap:5px!important}.socials .social{width:36px!important;height:36px!important;flex-basis:36px!important;border-radius:11px!important}.socials .social svg{width:18px!important;height:18px!important}}</style>'''
              s=s.replace('</head>',css+'</head>',1)

          # Replace the fragile Discord header SVG with a dedicated stable SVG.
          old='''<a class="social" href="https://discord.gg/DwHKtRMX2g" target="_blank" rel="noopener" aria-label="Discord"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M20.3 4.3A19.8 19.8 0 0 0 15.4 2.8l-.6 1.2a13.7 13.7 0 0 0-5.6 0L8.6 2.8A19.8 19.8 0 0 0 3.7 4.3C.8 8.5-.1 12.6.3 16.7a19.9 19.9 0 0 0 6.1 3.1l1.5-2.1a12.7 12.7 0 0 1-2.4-1.2l.6-.4c4.7 2.2 9.7 2.2 14.4 0l.6.4a12.7 12.7 0 0 1-2.4 1.2l1.5 2.1a19.9 19.9 0 0 0 6.1-3.1c.5-4.1-.4-8.2-3.3-12.4zM8.7 14.4c-1.4 0-2.6-1.3-2.6-2.9s1.2-2.9 2.6-2.9 2.6 1.3 2.6 2.9-1.2 2.9-2.6 2.9zm6.6 0c-1.4 0-2.6-1.3-2.6-2.9-1.2-1.6-2.6-2.9-2.6-2.9z"/></svg></a>'''
          new='''<a class="social" href="https://discord.gg/DwHKtRMX2g" target="_blank" rel="noopener" aria-label="Discord"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none"><path fill="currentColor" d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.49 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.67 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.89 19.89 0 0 0 5.993 3.03.077.077 0 0 0 .084-.028c.46-.63.87-1.293 1.226-1.99a.076.076 0 0 0-.041-.106 13.08 13.08 0 0 1-1.872-.89.075.075 0 0 1-.008-.125c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.794 8.18 1.794 12.061 0a.074.074 0 0 1 .078.009c.12.1.246.198.373.292a.075.075 0 0 1-.006.125c-.6.35-1.227.648-1.873.89a.076.076 0 0 0-.041.107c.36.696.77 1.359 1.225 1.989a.076.076 0 0 0 .084.028 19.83 19.83 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.68-3.548-13.66a.061.061 0 0 0-.032-.03ZM8.02 15.33c-1.18 0-2.15-1.085-2.15-2.42 0-1.336.95-2.42 2.15-2.42 1.21 0 2.17 1.094 2.15 2.42 0 1.335-.95 2.42-2.15 2.42Zm7.96 0c-1.18 0-2.15-1.085-2.15-2.42 0-1.336.95-2.42 2.15-2.42 1.21 0 2.17 1.094 2.15 2.42 0 1.335-.95 2.42-2.15 2.42Z"/></svg></a>'''
          if old in s: s=s.replace(old,new,1)

          # Replace the community Discord SVG only; leave community X text icon untouched.
          old2='''<div class="community-icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M20.3 4.3A19.8 19.8 0 0 0 15.4 2.8l-.6 1.2a13.7 13.7 0 0 0-5.6 0L8.6 2.8A19.8 19.8 0 0 0 3.7 4.3C.8 8.5-.1 12.6.3 16.7a19.9 19.9 0 0 0 6.1 3.1l1.5-2.1a12.7 12.7 0 0 1-2.4-1.2l.6-.4c4.7 2.2 9.7 2.2 14.4 0l.6.4a12.7 12.7 0 0 1-2.4 1.2l1.5 2.1a19.9 19.9 0 0 0 6.1-3.1c.5-4.1-.4-8.2-3.3-12.4zM8.7 14.4c-1.4 0-2.6-1.3-2.6-2.9s1.2-2.9 2.6-2.9 2.6 1.3 2.6 2.9-1.2 2.9-2.6 2.9zm6.6 0c-1.4 0-2.6-1.3-2.6-2.9-1.2-1.6-2.6-2.9-2.6-2.9z"/></svg></div>'''
          new2='''<div class="community-icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none"><path fill="currentColor" d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.49 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.67 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.89 19.89 0 0 0 5.993 3.03.077.077 0 0 0 .084-.028c.46-.63.87-1.293 1.226-1.99a.076.076 0 0 0-.041-.106 13.08 13.08 0 0 1-1.872-.89.075.075 0 0 1-.008-.125c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.794 8.18 1.794 12.061 0a.074.074 0 0 1 .078.009c.12.1.246.198.373.292a.075.075 0 0 1-.006.125c-.6.35-1.227.648-1.873.89a.076.076 0 0 0-.041.107c.36.696.77 1.359 1.225 1.989a.076.076 0 0 0 .084.028 19.83 19.83 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.68-3.548-13.66a.061.061 0 0 0-.032-.03ZM8.02 15.33c-1.18 0-2.15-1.085-2.15-2.42 0-1.336.95-2.42 2.15-2.42 1.21 0 2.17 1.094 2.15 2.42 0 1.335-.95 2.42-2.15 2.42Zm7.96 0c-1.18 0-2.15-1.085-2.15-2.42 0-1.336.95-2.42 2.15-2.42 1.21 0 2.17 1.094 2.15 2.42 0 1.335-.95 2.42-2.15 2.42Z"/></svg></div>'''
          if old2 in s: s=s.replace(old2,new2,1)

          # Restore mobile preview only if absent.
          if 'id="mobilePreviewOverlay"' not in s:
              css='''<style id="liuksoryu-mobile-preview-lock">#mobilePreviewOverlay{position:fixed;inset:0;z-index:9999;background:rgba(4,2,12,.78);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}body.mobile-preview-open #mobilePreviewOverlay{display:flex}#mobilePreviewDevice{position:relative;width:min(390px,92vw);height:min(844px,92vh);background:#090615;border:8px solid #1d1530;border-radius:32px;box-shadow:0 25px 80px rgba(0,0,0,.6),0 0 40px rgba(184,150,255,.25);overflow:hidden}#mobilePreviewLabel{position:absolute;top:0;left:0;right:0;height:30px;background:#130d28;color:#fff;font:700 11px/30px system-ui,sans-serif;letter-spacing:.14em;text-align:center;z-index:4}#mobilePreviewFrame{position:absolute;left:0;top:30px;width:100%;height:calc(100% - 30px);border:0;background:#090615}#mobilePreviewClose{position:absolute;top:3px;left:6px;z-index:5;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;font:700 18px/24px system-ui,sans-serif;cursor:pointer}#mobilePreviewClose:hover{background:rgba(239,131,255,.85);color:#160b22}body.mobile-preview-embedded #mobilePreviewToggle,body.mobile-preview-embedded #mobilePreviewOverlay{display:none!important}@media(max-width:600px){#mobilePreviewOverlay{padding:8px}#mobilePreviewDevice{width:calc(100vw - 16px);height:calc(100vh - 16px);border-width:6px;border-radius:24px}#mobilePreviewLabel{height:28px;line-height:28px;padding-left:34px}#mobilePreviewFrame{top:28px;height:calc(100% - 28px)}}@media(max-width:600px){#mobilePreviewToggle{display:none!important}}</style>'''
              html='''<div id="mobilePreviewOverlay" aria-hidden="true"><div id="mobilePreviewDevice"><div id="mobilePreviewLabel">MOBILE PREVIEW</div><button id="mobilePreviewClose" type="button" aria-label="Close mobile preview">×</button><iframe id="mobilePreviewFrame" title="LIUKSORYU mobile preview"></iframe></div></div><button id="mobilePreviewToggle" type="button" aria-label="Open mobile preview" title="Open mobile preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M10 5h4M11 18.5h2"/></svg></button><script id="liuksoryu-mobile-preview-script">(function(){var b=document.getElementById('mobilePreviewToggle'),o=document.getElementById('mobilePreviewOverlay'),f=document.getElementById('mobilePreviewFrame'),c=document.getElementById('mobilePreviewClose');if(!b||!o||!f)return;if(new URLSearchParams(location.search).has('mobile-preview')){document.body.classList.add('mobile-preview-embedded');return;}function close(){document.body.classList.remove('mobile-preview-open');o.setAttribute('aria-hidden','true');}function open(){document.body.classList.add('mobile-preview-open');o.setAttribute('aria-hidden','false');if(!f.src){f.src=location.href.split('#')[0].split('?')[0]+'?mobile-preview=1';}}b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();document.body.classList.contains('mobile-preview-open')?close():open();});c&&c.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();close();});o.addEventListener('click',function(e){if(e.target===o)close();});document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});})();</script>'''
              s=s.replace('</head>',css+'</head>',1).replace('</body>',html+'</body>',1)

          # Keep a stable marker for the protection workflow.
          if 'LIUKSORYU-MOBILE-PREVIEW-LOCKED' not in s:
              s=s.replace('</head>','<meta name="LIUKSORYU-MOBILE-PREVIEW-LOCKED" content="true"></head>',1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit repair and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply one-time social/mobile repair"
          git rm .github/workflows/fix-socials-mobile-preview-once.yml
          git commit -m "Remove one-time social/mobile repair workflow"
          git push
