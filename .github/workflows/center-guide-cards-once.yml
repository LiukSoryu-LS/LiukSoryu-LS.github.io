name: Center guide cards once

on:
  push:
    branches: [center-guide-cards]

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center the three guide cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.guides{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}'
          new = '.guides{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}'
          if old not in s:
              raise SystemExit('Expected guide grid declaration was not found; no changes made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage adjustment and remove this workflow
        run: |
          rm .github/workflows/center-guide-cards-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/center-guide-cards-once.yml
          git commit -m 'Center the three guide cards'
          git push
