name: Repair uploaded X asset
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Replace header X asset with uploaded file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'aria-label="X"><img class="liuksoryu-header-x-asset" src="x-icon-liuksoryu.png"'
          new = 'aria-label="X"><img class="liuksoryu-header-x-asset" src="X icon.png"'
          if old not in s:
              raise SystemExit('Expected header X asset reference was not found')
          s = s.replace(old, new, 1)
          marker = 'id="liuksoryu-uploaded-x-asset-lock"'
          if marker not in s:
              css = '<style id="liuksoryu-uploaded-x-asset-lock">.socials .social[aria-label="X"] .liuksoryu-header-x-asset{width:20px!important;height:20px!important;max-width:20px!important;max-height:20px!important;display:block!important;object-fit:contain!important;object-position:center!important;margin:0!important;padding:0!important;transform:none!important;flex:none!important}@media(max-width:600px){.socials .social[aria-label="X"] .liuksoryu-header-x-asset{width:18px!important;height:18px!important;max-width:18px!important;max-height:18px!important}}</style>'
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          v = Path('.github/workflows/protect-homepage-architecture.yml')
          vs = v.read_text(encoding='utf-8')
          vs = vs.replace('src="x-icon-liuksoryu.png"', 'src="X icon.png"')
          v.write_text(vs, encoding='utf-8')
          PY
          rm -f .github/workflows/repair-uploaded-x-asset.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/protect-homepage-architecture.yml .github/workflows/repair-uploaded-x-asset.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Use uploaded X icon asset on homepage'
          git push origin HEAD:main
