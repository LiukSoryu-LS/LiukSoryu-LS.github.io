name: Repair homepage once
on:
  push:
    branches: [homepage-repair-surgical]
    paths:
      - '_maintenance/repair-homepage.sh'
      - '.github/workflows/repair-homepage-once.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash _maintenance/repair-homepage.sh
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair homepage video loader and social layout'
          git push
