name: Temporary trusted X repair
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix-x-visual-balance-final' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-x-visual-balance-final
          fetch-depth: 0
      - name: Apply surgical X balance correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'(\.socials \.social\[aria-label="X"\] \.liuksoryu-header-x-asset\{width:)\d+px(!important;height:)\d+px(!important)'
          s, n1 = re.subn(pattern, r'\g<1>18px\g<2>18px\g<3>', s, count=1)
          mobile = r'(@media\(max-width:600px\).*?\.socials \.social\[aria-label="X"\] \.liuksoryu-header-x-asset\{width:)\d+px(!important;height:)\d+px(!important)'
          s, n2 = re.subn(mobile, r'\g<1>16px\g<2>16px\g<3>', s, count=1, flags=re.S)
          print('desktop rules changed:', n1)
          print('mobile rules changed:', n2)
          assert n1 == 1 and n2 == 1, 'Could not locate both X asset size rules'
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Tune X icon to balanced visual weight'
          git push origin HEAD:fix-x-visual-balance-final