name: Fix mobile preview once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clean mobile preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='LIUKSORYU-MOBILE-PREVIEW-CLEAN-FIX'
          if marker in s:
              raise SystemExit(0)
          css='''<style>/* LIUKSORYU-MOBILE-PREVIEW-CLEAN-FIX */\n#mobilePreviewToggle{position:fixed;right:18px;bottom:18px;width:52px;height:52px;z-index:2147483646;border:2px solid transparent;border-radius:16px;display:grid;place-items:center;color:#fff;cursor:pointer;background:linear-gradient(rgba(20,12,38,.96),rgba(20,12,38,.96)) padding-box,linear-gradient(110deg,#ef83ff,#b896ff,#7edcff) border-box;box-shadow:0 8px 24px rgba(0,0,0,.35)}\n#mobilePreviewToggle svg{width:24px;height:24px;display:block;pointer-events:none}\n#mobilePreviewOverlay{position:fixed;inset:0;z-index:2147483645;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(4,2,12,.8);backdrop-filter:blur(8px)}\nbody.mobile-preview-open{overflow:hidden}\nbody.mobile-preview-open #mobilePreviewOverlay{display:flex}\n#mobilePreviewDevice{width:min(390px,calc(100vw - 28px));height:min(844px,calc(100vh - 28px));border:7px solid #171022;border-radius:30px;background:#000;box-shadow:0 0 0 2px #6f4b9e,0 25px 80px rgba(0,0,0,.65);overflow:hidden;position:relative}\n#mobilePreviewLabel{position:absolute;top:0;left:0;right:0;height:30px;z-index:3;background:rgba(12,7,24,.96);color:#d9c7ec;text-align:center;font:700 9px/30px system-ui,sans-serif;letter-spacing:.14em;pointer-events:none}\n#mobilePreviewFrame{position:absolute;left:0;top:30px;width:100%;height:calc(100% - 30px);border:0;background:#090615}\n#mobilePreviewClose{position:absolute;top:3px;left:6px;z-index:5;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;font:700 18px/24px system-ui,sans-serif;cursor:pointer}\n#mobilePreviewClose:hover{background:rgba(239,131,255,.85);color:#160b22}\nbody.mobile-preview-embedded #mobilePreviewToggle,body.mobile-preview-embedded #mobilePreviewOverlay{display:none!important}\n@media(max-width:600px){#mobilePreviewOverlay{padding:8px}#mobilePreviewDevice{width:calc(100vw - 16px);height:calc(100vh - 16px);border-width:6px;border-radius:24px}#mobilePreviewLabel{height:28px;line-height:28px;padding-left:34px}#mobilePreviewFrame{top:28px;height:calc(100% - 28px)}}\n</style>'''
          html='''<div id="mobilePreviewOverlay" aria-hidden="true"><div id="mobilePreviewDevice"><div id="mobilePreviewLabel">MOBILE PREVIEW</div><button id="mobilePreviewClose" type="button" aria-label="Close mobile preview">×</button><iframe id="mobilePreviewFrame" title="LIUKSORYU mobile preview"></iframe></div></div><button id="mobilePreviewToggle" type="button" aria-label="Open mobile preview" title="Open mobile preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M10 5h4M11 18.5h2"/></svg></button>'''
          js='''<script>(function(){var b=document.getElementById('mobilePreviewToggle'),o=document.getElementById('mobilePreviewOverlay'),f=document.getElementById('mobilePreviewFrame'),c=document.getElementById('mobilePreviewClose');if(!b||!o||!f)return;if(new URLSearchParams(location.search).has('mobile-preview')){document.body.classList.add('mobile-preview-embedded');return;}function close(){document.body.classList.remove('mobile-preview-open');o.setAttribute('aria-hidden','true');}function open(){document.body.classList.add('mobile-preview-open');o.setAttribute('aria-hidden','false');if(!f.src){f.src=location.href.split('#')[0].split('?')[0]+'?mobile-preview=1';}}b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();document.body.classList.contains('mobile-preview-open')?close():open();});c&&c.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();close();});o.addEventListener('click',function(e){if(e.target===o)close();});document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});})();</script>'''
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>',html+js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/fix-mobile-preview-once.yml
          git rm .github/workflows/fix-mobile-preview-once.yml
          git commit -m 'Fix mobile preview without recursive embedding'
          git push
