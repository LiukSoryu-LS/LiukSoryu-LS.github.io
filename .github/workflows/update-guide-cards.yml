name: Update guide hub cards

on:
  push:
    paths:
      - '.github/workflows/update-guide-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-guides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update guide cards
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          start = html.index('<section class="section" id="guides">')
          end = html.index('<section class="section" id="community">', start)

          replacement = '''<section class="section" id="guides"><div class="shell"><div class="section-title"><span class="rule"></span><h2>GUIDES</h2><span class="rule"></span></div><div class="section-sub">BUILDS • LORE • PODCASTS • DISCUSSIONS</div><div class="guides"><a class="card guide" href="#"><div class="guide-overlay"><div class="guide-icon">⚔</div><h3>CHARACTER GUIDES</h3><p>Builds • Kits • Teams</p></div></a><a class="card guide" href="#"><div class="guide-overlay"><div class="guide-icon">◉</div><h3>LORE &amp; THEORY</h3><p>Stories • Analysis • Speculation</p></div></a><a class="card guide" href="#"><div class="guide-overlay"><div class="guide-icon">◫</div><h3>PODCASTS</h3><p>Lore • Games • Discussions</p></div></a><a class="card guide" href="#"><div class="guide-overlay"><div class="guide-icon">✦</div><h3>STREAM SUGGESTIONS</h3><p>Your Ideas • Live Discussions</p></div></a></div></div></section>'''

          html = html[:start] + replacement + html[end:]

          css_marker = '.guide-overlay{padding:18px;text-align:center}'
          css_override = '''.guide{min-height:190px;display:flex;align-items:stretch}.guide .image-slot{display:none}.guide-overlay{width:100%;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.guide-icon{font-size:30px;line-height:1;color:var(--lav);margin-bottom:10px}.guide-overlay h3{font-size:16px;margin:0 0 8px}.guide-overlay p{color:#b8a8d0;font-size:11px;line-height:1.45;margin:0}'''
          if css_marker in html and css_override not in html:
              html = html.replace(css_marker, css_marker + css_override, 1)

          path.write_text(html, encoding='utf-8')
      
      - name: Commit site change and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/update-guide-cards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-guide-cards.yml
          git diff --cached --quiet && exit 0
          git commit -m "Restructure guide hub cards"
          git push