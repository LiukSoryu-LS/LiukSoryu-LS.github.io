name: Restore footer social links

on:
  push:
    branches: [restore-footer-socials]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Instagram TikTok and Bilibili
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</div><div class="footer-links">'
          if 'aria-label="Instagram"' not in s and marker in s:
              icons = '''<a class="footer-social" href="https://www.instagram.com/liuksoryu/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4" fill="#080511"/><circle cx="17.5" cy="6.5" r="1.2" fill="#080511"/></svg></a><a class="footer-social" href="https://www.tiktok.com/@liuk.soryu?lang=en" target="_blank" rel="noopener" aria-label="TikTok"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M15 4c.3 2 1.4 3.5 3.5 4v2.4c-1.4 0-2.6-.4-3.7-1.1v5.9c0 3.1-2.5 5.3-5.7 5.3-2.8 0-4.9-2.1-4.9-4.7 0-2.8 2.3-4.8 5.2-4.8.4 0 .8 0 1.2.1v2.5c-.4-.1-.7-.2-1.1-.2-1.3 0-2.6.9-2.6 2.3 0 1.2 1 2.2 2.3 2.2 1.6 0 2.8-1 2.8-3.1V4H15z"/></svg></a><a class="footer-social" href="https://space.bilibili.com/3707055856683500?spm_id_from=333.1387.0.0" target="_blank" rel="noopener" aria-label="Bilibili"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M8.1 4.3 6 2.2l1.4-1.4 2.3 2.3c1.5-.4 3-.4 4.5 0l2.3-2.3L17.9 2l-2.1 2.1A8 8 0 0 1 21 10v7.2c0 2-1.6 3.6-3.6 3.6H6.6c-2 0-3.6-1.6-3.6-3.6V10a8 8 0 0 1 5.1-5.7ZM8.5 10.5A1.5 1.5 0 1 0 8.5 13.5a1.5 1.5 0 0 0 0-3Zm7 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg></a>'''
              s = s.replace(marker, icons + marker, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore footer social icons"
          git rm .github/workflows/restore-footer-socials.yml
          git commit -m "Remove one-time footer restore workflow"
          git push