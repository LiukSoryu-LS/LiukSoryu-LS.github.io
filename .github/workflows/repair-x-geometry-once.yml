name: Repair X icon geometry once
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix-x-icon-geometry-20260907' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-x-icon-geometry-20260907
          fetch-depth: 0
      - name: Apply surgical X geometry fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'id="liuksoryu-x-geometry-fix"'
          if marker not in s:
              css = '<style id="liuksoryu-x-geometry-fix">.socials .social[aria-label="X"] .liuksoryu-header-x-asset{width:18px!important;height:18px!important;max-width:none!important;max-height:none!important;display:block!important;object-fit:contain!important;object-position:center!important;flex:none!important;transform:none!important}@media(max-width:600px){.socials .social[aria-label="X"] .liuksoryu-header-x-asset{width:16px!important;height:16px!important;max-width:none!important;max-height:none!important}}</style>'
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix X icon visual geometry'
          git push origin HEAD:fix-x-icon-geometry-20260907
