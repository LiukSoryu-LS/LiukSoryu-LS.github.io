name: Add Qingxiao YouTube hero frame

on:
  push:
    branches: [add-qingxiao-youtube-hero]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace only the Qingxiao hero artwork with the YouTube guide
        shell: python
        run: |
          from pathlib import Path
          p = Path('LIUKSORYU_Guide_Builder_OBS_EXPORT_READY_SELF_CONTAINED_CLEANED.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="heroArt" id="heroLiveMedia"><div class="qx">清宵</div></div>'
          new = '<div class="heroArt youtubeFilled" id="heroLiveMedia"><iframe class="heroYoutubeFrame" src="https://www.youtube-nocookie.com/embed/64249L5VVFc?rel=0&amp;modestbranding=1" title="Qingxiao Character Guide — LIUKSORYU" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>'
          if old not in s:
              raise SystemExit('Expected hero artwork markup was not found; no change made.')
          s = s.replace(old, new, 1)
          css = '''<style id="liuksoryu-qingxiao-youtube-hero">.heroArt.youtubeFilled{background:#0b0714!important;padding:0!important;overflow:hidden!important;position:relative!important}.heroArt.youtubeFilled:before{display:none!important;content:none!important}.heroArt.youtubeFilled .heroYoutubeFrame{display:block!important;width:100%!important;height:100%!important;border:0!important;margin:0!important;background:#000!important}@media(max-width:900px){.heroArt.youtubeFilled{height:360px!important;min-height:360px!important}}@media(max-width:560px){.heroArt.youtubeFilled{height:280px!important;min-height:280px!important}} </style>'''
          if 'liuksoryu-qingxiao-youtube-hero' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify
        run: |
          grep -F '64249L5VVFc' LIUKSORYU_Guide_Builder_OBS_EXPORT_READY_SELF_CONTAINED_CLEANED.html
          grep -F 'liuksoryu-qingxiao-youtube-hero' LIUKSORYU_Guide_Builder_OBS_EXPORT_READY_SELF_CONTAINED_CLEANED.html
          git config user.name 'LiukSoryu-LS'
          git config user.email 'itsneoliuk@gmail.com'
          git add LIUKSORYU_Guide_Builder_OBS_EXPORT_READY_SELF_CONTAINED_CLEANED.html
          git commit -m 'Add Qingxiao YouTube guide to hero card'
          git push origin HEAD
          rm -f .github/workflows/add-qingxiao-youtube-hero.yml
          git add .github/workflows/add-qingxiao-youtube-hero.yml
          git commit -m 'Remove one-time Qingxiao repair workflow'
          git push origin HEAD
