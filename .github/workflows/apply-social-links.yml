name: Apply social header links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-social-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update header social buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="socials"><a class="social" href="#community">YT</a><a class="social" href="#community">TW</a><a class="social" href="#community">DC</a><a class="social" href="#community">X</a></div>'
          new='''<div class="socials"><a class="social" href="https://youtube.com/@liuksoryu" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><path d="M10 9l5 3-5 3V9z" fill="#130d28"/></svg></a><a class="social" href="https://www.twitch.tv/liuksoryu" target="_blank" rel="noopener" aria-label="Twitch"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg></a><a class="social" href="https://discord.gg/DwHKtRMX2g" target="_blank" rel="noopener" aria-label="Discord"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M19.54 5.01A16.84 16.84 0 0 0 15.3 3.7l-.52 1.06a15.7 15.7 0 0 0-5.56 0L8.7 3.7a16.84 16.84 0 0 0-4.24 1.31C1.78 9.08 1.05 13.06 1.41 16.99a16.9 16.9 0 0 0 5.2 2.63l1.25-1.7c-.69-.25-1.35-.57-1.98-.95l.49-.38c3.8 1.76 7.9 1.76 11.66 0l.5.38c-.64.38-1.3.7-1.99.95l1.25 1.7a16.9 16.9 0 0 0 5.2-2.63c.42-4.58-.72-8.52-3.45-11.98ZM8.68 14.45c-1.13 0-2.06-1.03-2.06-2.3s.91-2.3 2.06-2.3 2.08 1.03 2.06 2.3c0 1.27-.91 2.3-2.06 2.3Zm6.64 0c-1.13 0-2.06-1.03-2.06-2.3s.91-2.3 2.06-2.3 2.08 1.03 2.06 2.3c0 1.27-.91 2.3-2.06 2.3Z"/></svg></a><a class="social" href="https://x.com/LiukSoryu" target="_blank" rel="noopener" aria-label="X"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.657l-5.214-6.817-5.967 6.817H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"/></svg></a></div>'''
          if old not in s:
              raise SystemExit('Expected header social markup was not found.')
          s=s.replace(old,new)
          s=s.replace('.social{width:44px;height:44px;border:1px solid #4b3378;border-radius:14px;display:grid;place-items:center;font:700 12px system-ui;color:#cdbde0}.social:hover{border-color:var(--pink)}','.social{width:44px;height:44px;border:1px solid #4b3378;border-radius:14px;display:grid;place-items:center;color:#fff}.social svg{width:20px;height:20px;display:block}.social:hover{border-color:var(--pink);color:#fff}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/apply-social-links.yml
          git commit -m 'Link header social icons and use white icons'
          git push