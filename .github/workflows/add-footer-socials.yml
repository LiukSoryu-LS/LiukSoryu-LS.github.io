name: Add footer social icons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-footer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Instagram, TikTok and Bilibili footer icons
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = """
          .footer-right{display:flex;flex-direction:column;align-items:flex-end;gap:14px}.footer-socials{display:flex;gap:8px}.footer-social{width:44px;height:44px;border:2px solid transparent;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(rgba(8,5,16,.94),rgba(8,5,16,.94)) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;transition:.2s;flex:0 0 auto}.footer-social svg{width:20px;height:20px;display:block}.footer-social:hover{background:linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;box-shadow:0 0 16px rgba(239,131,255,.3),0 0 30px rgba(126,220,255,.12);color:#fff;transform:translateY(-2px)}@media(max-width:600px){.footer-right{align-items:flex-start;width:100%}.footer-socials{gap:7px}.footer-social{width:42px;height:42px}}
          """.strip().replace('\\n','')

          if '.footer-socials{' not in html:
              html = html.replace('</style>', css + '</style>', 1)

          old = '<div class="footer-links"><a href="#about">About</a><a href="#community">Community</a><a href="#top">Back to top ↑</a></div>'
          new = '''<div class="footer-right"><div class="footer-socials"><a class="footer-social" href="#" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg></a><a class="footer-social" href="#" target="_blank" rel="noopener" aria-label="TikTok"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M15.7 3c.4 2.1 1.6 3.5 3.7 4.1v3.1c-1.3-.1-2.5-.5-3.6-1.2v6.4c0 4-2.6 6.3-6.1 6.3-3.2 0-5.4-2.2-5.4-5.1 0-3.3 2.7-5.5 6.2-5.5.3 0 .7 0 1 .1v3.1c-.3-.1-.7-.2-1-.2-1.7 0-2.8 1-2.8 2.5 0 1.3.9 2.3 2.2 2.3 1.5 0 2.5-1 2.5-3V3h3.3z"/></svg></a><a class="footer-social" href="https://space.bilibili.com/370705586683500" target="_blank" rel="noopener" aria-label="Bilibili"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M8 6 6 3m10 3 2-3M8 12h.01M16 12h.01M8 16c1.2 1 2.4 1.4 4 1.4s2.8-.4 4-1.4" stroke-linecap="round"/></svg></a></div><div class="footer-links"><a href="#about">About</a><a href="#community">Community</a><a href="#top">Back to top ↑</a></div></div>'''

          if old in html:
              html = html.replace(old, new, 1)
          elif 'class="footer-socials"' not in html:
              raise SystemExit('Expected footer-links markup was not found')

          path.write_text(html, encoding='utf-8')

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-footer-socials.yml
          git commit -m "Add Instagram TikTok and Bilibili footer icons"
          git rm .github/workflows/add-footer-socials.yml
          git commit -m "Remove one-time footer icon workflow"
          git push
