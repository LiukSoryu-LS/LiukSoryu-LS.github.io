name: Add mobile preview and community asset

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply site updates
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          pattern = r'(<a class="card game-card"[^>]*>\s*<div class="image-slot)(?: has-image)?(?:">.*?</div>)(\s*<div class="game-name">And More To Come…</div>)'
          replacement = r'\1 has-image"><img src="profilediscordcommunity.png" alt="LIUKSORYU community" loading="lazy"></div>\2'
          s = re.sub(pattern, replacement, s, count=1, flags=re.S)

          css = base64.b64decode('').decode('utf-8')
          if '/* LIUKSORYU desktop mobile-view inspector */' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          controls = base64.b64decode('').decode('utf-8')
          if 'id="mobilePreviewToggle"' not in s:
              s = s.replace('</body>', controls + '</body>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/add-mobile-preview-and-more-image.yml
          git add index.html .github/workflows/add-mobile-preview-and-more-image.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Add mobile preview and community asset'
            git push
          fi
