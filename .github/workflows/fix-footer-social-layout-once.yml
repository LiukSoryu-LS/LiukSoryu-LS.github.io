name: Fix footer social layout once

on:
  push:
    branches: [lock-homepage-socials]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply surgical footer-only fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '.footer-right{display:flex;flex-direction:column;align-items:flex-end;gap:14px}'
          if marker not in s:
              raise SystemExit('Expected footer CSS marker not found; refusing to edit index.html')
          fix = marker + '@media(max-width:900px){.footer-inner{flex-direction:column;align-items:center;gap:18px}.footer-right{width:100%;align-items:center}.footer-socials{justify-content:center;flex-wrap:nowrap}.footer-links{justify-content:center}}'
          if '@media(max-width:900px){.footer-inner{flex-direction:column;align-items:center;gap:18px}' not in s:
              s = s.replace(marker, fix, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit only the homepage footer fix and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-footer-social-layout-once.yml
          git add index.html
          git commit -m 'Prevent footer social icons from disrupting layout [skip ci]'
          git push
