name: Protect homepage architecture

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR and base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate protected homepage contract
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          base = subprocess.check_output(['git', 'show', 'origin/main:index.html'], text=True)
          head = open('index.html', encoding='utf-8').read()
          def count(text, needle): return text.count(needle)
          def require_same(label, needle):
              a, b = count(base, needle), count(head, needle)
              if a != b: raise SystemExit(f'{label} changed: base={a}, PR={b}')

          # Header social architecture. X is validated separately below.
          for label in ['YouTube','Twitch','Discord']:
              require_same(f'Header {label} marker', f'aria-label="{label}"')
          require_same('Header social container','<div class="header-socials">')
          if '.social:nth-child(n+4)' in head:
              raise SystemExit('Obsolete generic social hiding rule detected.')

          # Footer social architecture.
          for label in ['Instagram','TikTok','Bilibili','Spotify']:
              require_same(f'Footer {label} marker', f'aria-label="{label}"')
          require_same('Footer social container','<div class="footer-socials">')

          # Games, videos, guides and community architecture.
          for needle,label in [
              ('class="games"','Games container'),
              ('class="game-name"','Game name elements'),
              ('class="image-slot has-image"','Game image slots'),
              ('class="videos"','Latest Videos container'),
              ('class="card video" data-video-card','Video card structure'),
              ('class="video-title"','Video title elements'),
              ('class="video-meta"','Video metadata elements'),
              ('class="guides"','Guides container'),
              ('class="community"','Community container')
          ]:
              if count(base,needle)==0: raise SystemExit(f'Baseline missing {label}')
              require_same(label,needle)

          # Protected assets must remain present.
          for asset in ['profilediscordcommunity.png','GuidesLiuksoryu.png','Lore.png','bobas friends.png']:
              if count(base,asset)==0 or count(head,asset)==0:
                  raise SystemExit(f'Protected asset missing: {asset}')

          # Exact About section remains protected.
          about_marker='<section class="section about-section" id="about">'
          def about_block(text):
              start=text.find(about_marker)
              if start<0: raise SystemExit('About section is missing.')
              end=text.find('</section>',start)
              if end<0: raise SystemExit('About section is malformed.')
              return text[start:end]
          if about_block(base)!=about_block(head):
              raise SystemExit('Protected About section changed.')

          # Mobile Preview contract remains immutable for markers already present.
          mobile=['id="mobilePreviewToggle"','id="mobilePreviewOverlay"','id="mobilePreviewDevice"','id="mobilePreviewLabel"','id="mobilePreviewClose"','id="mobilePreviewFrame"','?mobile-preview=1','mobile-preview-embedded']
          for needle in mobile:
              require_same(f'Mobile Preview marker {needle}',needle)

          # Permanent read-only X protection: clean geometry only, no repair step.
          clean='M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.657l-5.214-6.817-5.967 6.817H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231h3.272l-7.267 8.261 8.415 11.489Z'
          old='M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.657l-5.214-6.817-5.967 6.817H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231h3.272l-7.267 8.261 8.415 11.489Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z'
          if count(head,'aria-label="X"><svg')!=1: raise SystemExit('Header X SVG must exist exactly once.')
          if count(head,clean)!=1: raise SystemExit('Clean X SVG geometry must exist exactly once.')
          if old in head: raise SystemExit('Old malformed X SVG geometry detected.')
          if '8.415 11.489Z" fill="currentColor"' not in head: raise SystemExit('X fill contract changed.')
          if count(head,'<div class="community-icon">𝕏</div>')!=1: raise SystemExit('Community X text icon must remain untouched.')

          print('Homepage protection contract passed.')
          PY

      # Permanent read-only protection only; no self-modifying repair step.
