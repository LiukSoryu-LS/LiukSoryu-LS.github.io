name: Protect homepage architecture

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR and base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate protected homepage contract
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          base = subprocess.check_output(['git','show','origin/main:index.html'], text=True)
          head = open('index.html', encoding='utf-8').read()
          def count(text, needle): return text.count(needle)
          def require_same(label, needle):
              a,b=count(base,needle),count(head,needle)
              if a!=b: raise SystemExit(f'{label} changed: base={a}, PR={b}')

          # Header: four fixed platforms. The dedicated scoped rendering lock protects their visual behavior.
          for label in ['YouTube','Twitch','Discord','X']:
              require_same(f'Header {label} marker',f'aria-label="{label}"')
          require_same('Header social container','<div class="socials">')
          # Legacy nth-child CSS is tolerated only when unchanged; it must never be introduced or altered.
          require_same('Header legacy nth-child selector count','.social:nth-child(n+4)')

          # Footer: four explicit platforms.
          for label in ['Instagram','TikTok','Bilibili','Spotify']:
              require_same(f'Footer {label} marker',f'aria-label="{label}"')
          require_same('Footer social container','<div class="footer-socials">')

          # Games and videos structure.
          for needle,label in [('class="games"','Games container'),('class="game-card"','Game card elements'),('class="game-name"','Game name elements'),('class="image-slot has-image"','Game image slots')]:
              if count(base,needle)==0: raise SystemExit(f'Baseline missing {label}')
              require_same(label,needle)
          for needle,label in [('class="videos"','Latest Videos container'),('class="video"','Video card structure'),('data-video-card','Video data-card markers'),('thumbnail','Thumbnail contract')]:
              if count(base,needle)==0: raise SystemExit(f'Baseline missing {label}')
              require_same(label,needle)
          if count(base,'data-video-card')!=5: raise SystemExit('Baseline Latest Videos card count is not 5.')

          # Distinct assets remain protected.
          for asset in ['profilediscordcommunity.png','Profile.jpg']:
              require_same(f'Protected asset {asset}',asset)

          # Exact About copy remains protected.
          about_marker='<section class="section about-section" id="about">'
          def about_block(text):
              start=text.find(about_marker)
              if start<0: raise SystemExit('About section is missing.')
              end=text.find('</section>',start)
              if end<0: raise SystemExit('About section is malformed.')
              return text[start:end]
          head_about=about_block(head)
          source_copy=[
              'The games that shaped my childhood? <strong>Final Fantasy IX, The Legend of Dragoon, and Kingdom Hearts.</strong> 💜',
              "I've been an RPG lover through and through ever since. I'm also a <strong>beginner MTG player</strong>, and I have a deep passion for games with intricate lore, fascinating characters, and worlds that feel like there's always something more to discover.",
              '<p>As for me?</p>','<strong>A little bit messy. A little bit fruity. A little bit shy.</strong>',
              'But always curious, always passionate, and probably overthinking some piece of game lore somewhere. 😂',
              "I have a pretty strong sense of morality and I can't stand injustice or discrimination. I want this to be a space where people can enjoy games, talk about stories, share theories, and just be themselves without feeling judged.",
              '<p>And then there\'s the streaming...</p>','<strong>Stream mayhem is never the same twice.</strong>',
              '<p>Sometimes there\'s a plan. Sometimes there absolutely isn\'t. Sometimes everything works perfectly.</p>',
              '<p>And sometimes... well... <strong>we improvise.</strong> 😂</p>','<p>So be prepared for the unexpected.</p>']
          for piece in source_copy:
              if piece not in head_about: raise SystemExit(f'Protected About copy missing: {piece}')

          # Mobile preview: if already present on main, every protected marker becomes immutable.
          # This permits the one-time restoration while preventing later removal or duplication.
          mobile=[
              'LIUKSORYU-MOBILE-PREVIEW-LOCKED','id="mobilePreviewToggle"','id="mobilePreviewOverlay"','id="mobilePreviewDevice"',
              'id="mobilePreviewLabel"','id="mobilePreviewClose"','id="mobilePreviewFrame"','?mobile-preview=1',
              'mobile-preview-embedded','id="liuksoryu-mobile-preview-lock"','id="liuksoryu-mobile-preview-script"']
          for needle in mobile:
              a,b=count(base,needle),count(head,needle)
              if a==0:
                  if b not in (0,1): raise SystemExit(f'Invalid new Mobile Preview marker count for {needle}: {b}')
              elif b!=a:
                  raise SystemExit(f'Protected Mobile Preview marker changed: {needle} base={a} PR={b}')

          # Header rendering lock is immutable once present.
          for needle in ['id="liuksoryu-header-icon-lock"','.socials .social{display:grid!important','.socials .social svg{width:20px!important']:
              a,b=count(base,needle),count(head,needle)
              if a==0:
                  if b not in (0,1): raise SystemExit(f'Invalid new header lock marker count for {needle}: {b}')
              elif b!=a:
                  raise SystemExit(f'Protected header icon lock changed: {needle} base={a} PR={b}')

          print('Homepage protection contract passed.')
          PY
