name: Protect homepage architecture

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR and base
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate protected homepage contract
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess

          base = subprocess.check_output(['git', 'show', 'origin/main:index.html'], text=True)
          head = open('index.html', encoding='utf-8').read()

          def count(text, needle):
              return text.count(needle)

          def require_same(label, needle):
              a, b = count(base, needle), count(head, needle)
              if a != b:
                  raise SystemExit(f'{label} changed: base={a}, PR={b}')

          def header_socials(text):
              m = re.search(r'<div class="socials">(.*?)</div></div></header>', text, re.S)
              if not m:
                  raise SystemExit('Header social container is missing or malformed.')
              return m.group(1)

          base_header = header_socials(base)
          head_header = header_socials(head)
          for label in ['YouTube', 'Twitch', 'Discord', 'X']:
              if head_header.count(f'aria-label="{label}"') != base_header.count(f'aria-label="{label}"'):
                  raise SystemExit(f'Header {label} marker changed.')
          if '.social:nth-child(n+4)' in head:
              raise SystemExit('Obsolete generic social hiding rule detected.')

          for label in ['Instagram', 'TikTok', 'Bilibili', 'Spotify']:
              require_same(f'Footer {label} marker', f'aria-label="{label}"')
          require_same('Footer social container', '<div class="footer-socials">')

          for needle, label in [
              ('class="games"', 'Games container'),
              ('class="game-name"', 'Game name elements'),
              ('class="image-slot has-image"', 'Game image slots'),
              ('class="videos"', 'Latest Videos container'),
              ('class="card video"', 'Video card structure'),
              ('.video .image-slot', 'Video thumbnail styling'),
              ('class="video-title"', 'Video title elements'),
              ('class="video-meta"', 'Video metadata elements')
          ]:
              if count(base, needle) == 0:
                  raise SystemExit(f'Baseline missing {label}')
              require_same(label, needle)

          for asset in ['profilediscordcommunity.png', 'Profile.jpg']:
              require_same(f'Protected asset {asset}', asset)

          about_marker = '<section class="section about-section" id="about">'
          def about_block(text):
              start = text.find(about_marker)
              if start < 0:
                  raise SystemExit('About section is missing.')
              end = text.find('</section>', start)
              if end < 0:
                  raise SystemExit('About section is malformed.')
              return text[start:end]
          if about_block(base) != about_block(head):
              raise SystemExit('Protected About section changed.')

          mobile = [
              'LIUKSORYU-MOBILE-PREVIEW-LOCKED', 'id="mobilePreviewToggle"',
              'id="mobilePreviewOverlay"', 'id="mobilePreviewDevice"',
              'id="mobilePreviewLabel"', 'id="mobilePreviewClose"',
              'id="mobilePreviewFrame"', '?mobile-preview=1',
              'mobile-preview-embedded', 'id="liuksoryu-mobile-preview-lock"',
              'id="liuksoryu-mobile-preview-script"'
          ]
          for needle in mobile:
              a, b = count(base, needle), count(head, needle)
              if a == 0:
                  if b not in (0, 1):
                      raise SystemExit(f'Invalid new Mobile Preview marker count for {needle}: {b}')
              elif b != a:
                  raise SystemExit(f'Protected Mobile Preview marker changed: {needle} base={a} PR={b}')

          required = [
              'id="liuksoryu-final-social-render-lock"',
              'M524.531,69.836',
              'aria-label="X"><img class="liuksoryu-header-x-asset" src="x-icon-liuksoryu.png"',
              'fill="currentColor"'
          ]
          for needle in required:
              if count(head, needle) == 0:
                  raise SystemExit(f'Missing final social rendering contract: {needle}')
          if count(head, 'M524.531,69.836') != 2:
              raise SystemExit('Stable Discord path must exist in both header and community Discord icons.')
          if count(head, 'M20.3 4.3A19.8'):
              raise SystemExit('Malformed legacy Discord path detected.')
          if count(head, 'aria-label="X"><svg') != 0:
              raise SystemExit('Header X SVG must remain replaced by the supplied branded asset.')
          if count(head, '<div class="community-icon">𝕏</div>') != 1:
              raise SystemExit('Community X text icon must remain untouched.')
          if count(head, 'id="liuksoryu-final-social-render-lock"') != 1:
              raise SystemExit('Final social rendering lock must exist exactly once.')

          print('Homepage protection contract passed.')
          PY
