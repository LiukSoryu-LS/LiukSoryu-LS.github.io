name: Fix duplicate About section
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only the intended About section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'<section\b[^>]*\bid=["\']about["\'][^>]*>.*?</section>', re.S | re.I)
          matches = list(pattern.finditer(s))
          if len(matches) <= 1:
              print(f'About sections found: {len(matches)} — nothing to remove.')
              raise SystemExit(0)
          keep = next((m for m in matches if 'about-section' in m.group(0)), matches[0])
          parts = []
          last = 0
          for m in matches:
              if m is keep:
                  continue
              parts.append(s[last:m.start()])
              last = m.end()
          parts.append(s[last:])
          s = ''.join(parts)
          p.write_text(s, encoding='utf-8')
          print(f'Removed {len(matches)-1} duplicate About section(s).')
          PY
      - name: Commit and clean up
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git rm .github/workflows/fix-duplicate-about.yml
          if git diff --cached --quiet; then
            git commit --allow-empty -m "Verify About section"
          else
            git commit -m "Remove duplicate About section"
          fi
          git push
