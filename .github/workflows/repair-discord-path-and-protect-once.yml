name: One-time Discord path and protection repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Discord path and protection repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair Discord SVGs and reinforce protection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          path='M20.317 4.3698a19.7913 19.7913 0 0 0-4.8851-1.5152.0741.0741 0 0 0-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 0 0-.0785-.037A19.7363 19.7363 0 0 0 3.677 4.3698a.0699.0699 0 0 0-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 0 0 .0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 0 0 .0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 0 0-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 0 1-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 0 1 .0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 0 1 .0785.0095c.1202.099.246.198.3728.2924a.077.077 0 0 1-.0066.1276c-.6.35-1.227.648-1.873.8914a.0766.0766 0 0 0-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 0 0 .0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 0 0 .0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 0 0-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.335-.946 2.4189-2.1568 2.4189z'
          s=s.replace('M20.3 4.3A19.8 19.8 0 0 0 15.4 2.8l-.6 1.2a13.7 13.7 0 0 0-5.6 0L8.6 2.8A19.8 19.8 0 0 0 3.7 4.3C.8 8.5-.1 12.6.3 16.7a19.9 19.9 0 0 0 6.1 3.1l1.5-2.1a12.7 12.7 0 0 1-2.4-1.2l.6-.4c4.7 2.2 9.7 2.2 14.4 0l.6.4a12.7 12.7 0 0 1-2.4 1.2l1.5 2.1a19.9 19.9 0 0 0 6.1-3.1c.5-4.1-.4-8.2-3.3-12.4zM8.7 14.4c-1.4 0-2.6-1.3-2.6-2.9s1.2-2.9 2.6-2.9 2.6 1.3 2.6 2.9-1.2 2.9-2.6 2.9zm6.6 0c-1.4 0-2.6-1.3-2.6-2.9-1.2-1.6-2.6-2.9-2.6-2.9z',path)
          p.write_text(s,encoding='utf-8')

          q=Path('.github/workflows/protect-homepage-architecture.yml')
          w=q.read_text(encoding='utf-8')
          marker="          print('Homepage protection contract passed.')"
          guard="""          # Exact social SVG contracts are immutable: malformed or substitute paths must fail the PR.\n          for needle,label in [\n              ('id=\\\"liuksoryu-social-render-lock\\\"','Social rendering lock'),\n              ('M20.317 4.3698','Canonical Discord SVG path'),\n              ('aria-label=\\\"X\\\"><svg','Header X SVG marker'),\n              ('fill=\\\"currentColor\\\"/></svg></a></div></div></header>','Header SVG closing contract'),\n          ]:\n              if count(base,needle)==0: raise SystemExit(f'Baseline missing protected social marker: {label}')\n              require_same(label,needle)\n\n"""
          if 'Canonical Discord SVG path' not in w:
              w=w.replace(marker,guard+marker,1)
          q.write_text(w,encoding='utf-8')
          PY
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/protect-homepage-architecture.yml
          git commit -m 'Apply Discord path and protection repair'
          git rm .github/workflows/repair-discord-path-and-protect-once.yml
          git commit -m 'Remove one-time Discord path and protection repair workflow'
          git push
