name: Controlled icon preview repair
on:
  push:
    branches: [fix-social-svg-rendering-lock]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Apply controlled icon preview repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homepage safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="liuksoryu-header-icon-lock-v2"' not in s:
            css='''<style id="liuksoryu-header-icon-lock-v2">.socials .social{display:grid!important;visibility:visible!important;opacity:1!important;place-items:center!important}.socials .social svg{display:block!important;visibility:visible!important;opacity:1!important;overflow:visible!important;flex:none!important}.socials .social[aria-label="Discord"] svg{width:22px!important;height:22px!important}.socials .social[aria-label="Discord"] svg path{fill:#fff!important;stroke:none!important}.socials .social[aria-label="X"] svg{width:21px!important;height:21px!important}.socials .social[aria-label="X"] svg path{fill:#fff!important;stroke:none!important}@media(max-width:900px){.socials .social[aria-label="X"]{display:grid!important}}@media(max-width:600px){.socials .social[aria-label="Discord"] svg{width:19px!important;height:19px!important}.socials .social[aria-label="X"] svg{width:18px!important;height:18px!important}}</style>'''
            s=s.replace('</head>',css+'</head>',1)
          if 'id="liuksoryu-mobile-preview-lock-v2"' not in s:
            css='''<style id="liuksoryu-mobile-preview-lock-v2">#mobilePreviewOverlay{position:fixed;inset:0;z-index:9999;background:rgba(4,2,12,.78);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}body.mobile-preview-open #mobilePreviewOverlay{display:flex}#mobilePreviewDevice{position:relative;width:min(390px,92vw);height:min(844px,92vh);background:#090615;border:8px solid #1d1530;border-radius:32px;box-shadow:0 25px 80px rgba(0,0,0,.6),0 0 40px rgba(184,150,255,.25);overflow:hidden}#mobilePreviewLabel{position:absolute;top:0;left:0;right:0;height:30px;background:#130d28;color:#fff;font:700 11px/30px system-ui,sans-serif;letter-spacing:.14em;text-align:center;z-index:4}#mobilePreviewFrame{position:absolute;left:0;top:30px;width:100%;height:calc(100% - 30px);border:0;background:#090615}#mobilePreviewClose{position:absolute;top:3px;left:6px;z-index:5;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;font:700 18px/24px system-ui,sans-serif;cursor:pointer}body.mobile-preview-embedded #mobilePreviewToggle,body.mobile-preview-embedded #mobilePreviewOverlay{display:none!important}@media(max-width:600px){#mobilePreviewOverlay{padding:8px}#mobilePreviewDevice{width:calc(100vw - 16px);height:calc(100vh - 16px);border-width:6px;border-radius:24px}#mobilePreviewLabel{height:28px;line-height:28px;padding-left:34px}#mobilePreviewFrame{top:28px;height:calc(100% - 28px)}}@media(max-width:600px){#mobilePreviewToggle{display:none!important}}</style>'''
            s=s.replace('</head>',css+'</head>',1)
          if 'id="mobilePreviewOverlay"' not in s:
            html='''<div id="mobilePreviewOverlay" aria-hidden="true"><div id="mobilePreviewDevice"><div id="mobilePreviewLabel">MOBILE PREVIEW</div><button id="mobilePreviewClose" type="button" aria-label="Close mobile preview">×</button><iframe id="mobilePreviewFrame" title="LIUKSORYU mobile preview"></iframe></div></div><button id="mobilePreviewToggle" type="button" aria-label="Open mobile preview" title="Open mobile preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M10 5h4M11 18.5h2"/></svg></button><script id="liuksoryu-mobile-preview-script">(function(){var b=document.getElementById('mobilePreviewToggle'),o=document.getElementById('mobilePreviewOverlay'),f=document.getElementById('mobilePreviewFrame'),c=document.getElementById('mobilePreviewClose');if(!b||!o||!f)return;if(new URLSearchParams(location.search).has('mobile-preview')){document.body.classList.add('mobile-preview-embedded');return;}function close(){document.body.classList.remove('mobile-preview-open');o.setAttribute('aria-hidden','true');}function open(){document.body.classList.add('mobile-preview-open');o.setAttribute('aria-hidden','false');if(!f.src){f.src=location.href.split('#')[0].split('?')[0]+'?mobile-preview=1';}}b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();document.body.classList.contains('mobile-preview-open')?close():open();});c&&c.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();close();});o.addEventListener('click',function(e){if(e.target===o)close();});document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});})();</script>'''
            s=s.replace('</body>',html+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply controlled icon preview repair'
          git rm .github/workflows/repair-icons-preview-once.yml
          git commit -m 'Remove controlled icon preview repair workflow'
          git push
