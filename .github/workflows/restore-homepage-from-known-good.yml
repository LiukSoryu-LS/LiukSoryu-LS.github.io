name: One-time homepage recovery
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  recover:
    if: github.event.head_commit.message != 'Recover homepage and remove Lore card'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good homepage and remove Lore card
        shell: bash
        run: |
          set -e
          git show 06ea6ecf8061539dfdddc714f9406bf2c9c99fa5:index.html > index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'<a class="card guide" href="#"><div class="guide-overlay"><div class="guide-icon">◉</div><h3>LORE &amp; THEORY</h3><p>Stories • Analysis • Speculation</p></div></a>'
          s,n=re.subn(pattern,'',s,count=1)
          if n != 1:
              raise SystemExit('Lore & Theory card not found in known-good homepage')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove recovery workflow after successful repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/restore-homepage-from-known-good.yml
          git commit -m 'Recover homepage and remove Lore card'
          git push
