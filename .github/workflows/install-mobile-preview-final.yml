name: Install final desktop mobile preview

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: write
  pages: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mobile preview
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*/\* LIUKSORYU desktop mobile preview(?: FINAL)? \*/.*?(?=</style>)','',s,flags=re.S)
          s=re.sub(r'\s*/\* LIUKSORYU desktop mobile-view inspector(?: v2| FINAL)? \*/.*?(?=</style>)','',s,flags=re.S)
          s=re.sub(r'\s*<div id="mobilePreviewOverlay".*?</script>','',s,count=1,flags=re.S)
          s=re.sub(r'\s*<button id="mobilePreviewToggle".*?</button>','',s,count=1,flags=re.S)
          css=base64.b64decode('').decode('utf-8')
          s=s.replace('</style>',css+'</style>',1)
          controls=base64.b64decode('').decode('utf-8')
          s=s.replace('</html>',controls+'</html>',1)
          p.write_text(s,encoding='utf-8')

      - name: Verify button exists
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="mobilePreviewToggle"') == 1
          assert s.count('id="mobilePreviewFrame"') == 1
          print('Mobile preview verified.')

      - name: Commit and request Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f mobile-preview-install.trigger .github/workflows/install-mobile-preview-final.yml
          git add index.html mobile-preview-install.trigger .github/workflows/install-mobile-preview-final.yml
          git commit -m 'Install working desktop mobile preview'
          git push
          gh api --method POST /repos/${{ github.repository }}/pages/builds --silent || true
