name: Fix footer social layout on main once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Apply surgical footer-only fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '.footer-right{display:flex;flex-direction:column;align-items:flex-end;gap:14px}'
          if marker not in s:
              raise SystemExit('Expected footer CSS marker not found; refusing to edit index.html')
          rule = '@media(max-width:900px){.footer-inner{flex-direction:column;align-items:center;gap:18px}.footer-right{width:100%;align-items:center}.footer-socials{justify-content:center;flex-wrap:nowrap}.footer-links{justify-content:center}}'
          if rule not in s:
              s = s.replace(marker, marker + rule, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit only the footer fix and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-footer-social-layout-main-once.yml
          git add index.html
          if git diff --cached --quiet; then
            git commit -m 'Remove one-time footer layout fixer [skip ci]'
          else
            git commit -m 'Fix footer social icon layout [skip ci]'
          fi
          git push
