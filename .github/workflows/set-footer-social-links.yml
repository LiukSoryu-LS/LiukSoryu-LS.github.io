name: Set footer social links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set exact footer links
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="#" target="_blank" rel="noopener" aria-label="Instagram"', 'href="https://www.instagram.com/liuksoryu/" target="_blank" rel="noopener" aria-label="Instagram"')
          s = s.replace('href="#" target="_blank" rel="noopener" aria-label="TikTok"', 'href="https://www.tiktok.com/@liuk.soryu?lang=en" target="_blank" rel="noopener" aria-label="TikTok"')
          s = s.replace('href="https://space.bilibili.com/370705586683500" target="_blank" rel="noopener" aria-label="Bilibili"', 'href="https://space.bilibili.com/3707055856683500?spm_id_from=333.1387.0.0" target="_blank" rel="noopener" aria-label="Bilibili"')
          p.write_text(s, encoding='utf-8')

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link footer social icons"
          git rm .github/workflows/set-footer-social-links.yml
          git commit -m "Remove one-time footer link workflow"
          git push
