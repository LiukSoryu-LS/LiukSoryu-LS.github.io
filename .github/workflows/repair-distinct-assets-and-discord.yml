name: Repair distinct profile and Discord assets
on:
  push:
    branches: [fix-discord-profile-exact]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair homepage precisely
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # 1. About uses the personal profile asset. The community/logo asset
          # remains untouched everywhere else.
          about_marker = 'id="about"'
          about_pos = s.find(about_marker)
          if about_pos < 0:
              raise SystemExit('About section not found')
          section_start = s.rfind('<section', 0, about_pos)
          section_end = s.find('</section>', about_pos)
          if section_start < 0 or section_end < 0:
              raise SystemExit('Could not isolate About section')
          about_block = s[section_start:section_end]
          if 'profilediscordcommunity.png' in about_block:
              about_block = about_block.replace('profilediscordcommunity.png', 'Profile.jpg')
              s = s[:section_start] + about_block + s[section_end:]

          discord_svg = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.69 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.027c.462-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.2 13.2 0 0 1-1.872-.89.077.077 0 0 1-.008-.128c.126-.094.252-.192.373-.291a.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.009c.121.099.247.198.374.292a.077.077 0 0 1-.006.127c-.598.344-1.22.64-1.873.89a.075.075 0 0 0-.04.107c.36.698.77 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.9 19.9 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.55-13.66a.06.06 0 0 0-.032-.027zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.418 2.157-2.418 1.21 0 2.166 1.095 2.157 2.418 0 1.334-.956 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.418 2.157-2.418 1.21 0 2.166 1.095 2.157 2.418 0 1.334-.956 2.419-2.157 2.419z"/></svg>'

          # 2. Header Discord: target only the social link carrying the Discord aria label.
          marker = 'aria-label="Discord"'
          pos = s.find(marker)
          if pos >= 0:
              svg_start = s.find('<svg', pos)
              svg_end = s.find('</svg>', svg_start)
              if svg_start >= 0 and svg_end >= 0:
                  s = s[:svg_start] + discord_svg + s[svg_end + 6:]

          # 3. Community Discord card: preserve its asset role, but repair only its glyph.
          scan = 0
          while True:
              card_start = s.find('<a class="community-card"', scan)
              if card_start < 0:
                  break
              card_end = s.find('</a>', card_start)
              if card_end < 0:
                  break
              block = s[card_start:card_end]
              if 'Discord' in block or 'DISCORD' in block:
                  icon_start = block.find('<div class="community-icon"')
                  if icon_start >= 0:
                      icon_open_end = block.find('>', icon_start)
                      icon_end = block.find('</div>', icon_open_end)
                      if icon_open_end >= 0 and icon_end >= 0:
                          block = block[:icon_open_end + 1] + discord_svg + block[icon_end:]
                          s = s[:card_start] + block + s[card_end:]
                          card_end = card_start + len(block)
              scan = card_end + 4

          # 4. Explicit sizing/overflow guard for desktop and mobile.
          if 'id="liuksoryu-discord-asset-fix"' not in s:
              fix = '<style id="liuksoryu-discord-asset-fix">.social[aria-label="Discord"] svg,.community-card .community-icon svg{width:22px!important;height:22px!important;display:block!important;overflow:visible!important;flex:none!important}.social[aria-label="Discord"],.community-card .community-icon{overflow:visible}</style>'
              s = s.replace('</head>', fix + '</head>', 1)

          if s == original:
              raise SystemExit('No intended homepage change was made; aborting.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify exact asset roles and repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          about_pos = s.find('id="about"')
          section_start = s.rfind('<section', 0, about_pos)
          section_end = s.find('</section>', about_pos)
          about = s[section_start:section_end]
          assert 'Profile.jpg' in about, 'About does not use Profile.jpg'
          assert 'profilediscordcommunity.png' in s, 'Community/logo asset was unexpectedly removed'
          assert 'id="liuksoryu-discord-asset-fix"' in s, 'Discord sizing guard missing'
          assert 'M20.317 4.37' in s, 'Discord SVG path missing'
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix distinct profile asset and Discord icons' || exit 1
          git rm .github/workflows/repair-distinct-assets-and-discord.yml
          git commit -m 'Remove one-time asset repair workflow'
          git push
