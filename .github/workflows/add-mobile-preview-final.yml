name: Add working desktop mobile preview

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add mobile preview controls
        shell: python
        run: |
          import base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="mobilePreviewToggle"' not in s:
              payload=''
              controls=base64.b64decode(payload).decode('utf-8')
              s=s.replace('</body>',controls+'</body>',1)
              p.write_text(s,encoding='utf-8')
              print('Mobile preview controls inserted')
          else:
              print('Mobile preview controls already present')

      - name: Commit and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/add-mobile-preview-final.yml
          git add index.html .github/workflows/add-mobile-preview-final.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Add working desktop mobile preview button'
            git push
          fi
          gh api --method POST /repos/${{ github.repository }}/pages/builds --silent || true
