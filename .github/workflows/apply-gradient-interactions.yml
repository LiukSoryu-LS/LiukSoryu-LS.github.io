name: Apply gradient interactive styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gradient-interactions.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply gradient frames and hover effects
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</style>'
          css=r'''
/* LIUKSORYU interactive gradient system */
.card{border:2px solid transparent;background:linear-gradient(145deg,rgba(30,18,58,.88),rgba(12,8,28,.96)) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;}
.card:hover{transform:translateY(-3px);border-color:transparent;background:linear-gradient(145deg,rgba(43,23,76,.96),rgba(18,10,40,.98)) padding-box,linear-gradient(110deg,#f38bff 0%,#c39cff 48%,#8de5ff 100%) border-box;box-shadow:0 0 18px rgba(239,131,255,.28),0 0 38px rgba(126,220,255,.16),0 14px 38px rgba(128,67,190,.25)}
.btn{border:2px solid transparent;background:linear-gradient(rgba(25,15,48,.78),rgba(25,15,48,.78)) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;}
.btn:hover{transform:translateY(-2px);border-color:transparent;background:linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;color:#160b22;box-shadow:0 0 20px rgba(239,131,255,.35),0 0 42px rgba(126,220,255,.18)}
.btn:hover .btn-icon{color:#160b22}
.btn.primary{border:2px solid transparent;background:linear-gradient(110deg,#f18aff 0%,#a8a0ff 55%,#8bdcff 100%) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;}
.btn.primary:hover{background:linear-gradient(110deg,#f49aff 0%,#b7adff 55%,#9be5ff 100%) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;box-shadow:0 0 22px rgba(239,131,255,.42),0 0 46px rgba(126,220,255,.2),0 12px 35px rgba(214,124,255,.3)}
.social{border:2px solid transparent;background:linear-gradient(rgba(8,5,16,.94),rgba(8,5,16,.94)) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;}
.social:hover{border-color:transparent;background:linear-gradient(rgba(25,15,48,.96),rgba(25,15,48,.96)) padding-box,linear-gradient(110deg,#ef83ff 0%,#b896ff 48%,#7edcff 100%) border-box;box-shadow:0 0 16px rgba(239,131,255,.3),0 0 30px rgba(126,220,255,.12);color:#fff}
'''
          if 'LIUKSORYU interactive gradient system' not in s:
              s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/apply-gradient-interactions.yml
          git commit -m 'Add gradient frames and hover glow to interactive elements'
          git push