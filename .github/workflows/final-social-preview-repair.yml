name: Final social and mobile preview repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.event.pull_request.head.ref == 'fix-discord-x-preview-final' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply final surgical repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          canonical='''M20.317 4.3698a19.7913 19.7913 0 0 0-4.8851-1.5152.0741.0741 0 0 0-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 0 0-.0785-.037A19.7363 19.7363 0 0 0 3.677 4.3698a.0699.0699 0 0 0-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 0 0 .0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 0 0 .0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 0 0-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 0 1-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 0 1 .0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 0 1 .0785.0095c.1202.099.246.198.3728.2924a.077.077 0 0 1-.0066.1276c-.6.35-1.227.648-1.873.8914a.0766.0766 0 0 0-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 0 0 .0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 0 0 .0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 0 0-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.335-.946 2.4189-2.1568 2.4189z'''
          xpath='M18.244 2.25h3.308l-7.227 8.26-7.227-8.26H1.68l7.73 8.835L1.254 21.75h3.308l7.53-8.57 7.485 8.57h3.423l-7.7-8.783z'
          # Repair every Discord SVG instance without touching the community X text icon.
          def discord(m):
              tag=m.group(0)
              tag=re.sub(r'<svg([^>]*)>', lambda x: '<svg'+re.sub(r'\sfill="[^"]*"','',x.group(1))+' fill="currentColor">', tag, count=1)
              tag=re.sub(r'<path\s+d="[^"]*"', '<path d="'+canonical+'"', tag, count=1)
              return tag
          s,n=re.subn(r'<svg[^>]*aria-hidden="true"[^>]*>\s*<path\s+d="[^"]*"\s*/>\s*</svg>', discord, s)
          if n < 2:
              raise SystemExit(f'Expected at least 2 Discord SVGs to repair, found {n}')
          # Force the header X SVG to the approved path and fill.
          s=re.sub(r'(<a[^>]*aria-label="X"[^>]*>\s*<svg[^>]*>\s*<path\s+d=")[^"]*("\s+fill="currentColor"\s*/>\s*</svg>\s*</a>)', r'\g<1>'+xpath+r'\g<2>', s, count=1)
          # Remove obsolete generic mobile hiding and prior target-specific lock styles.
          s=s.replace('.social:nth-child(n+4){display:none}', '')
          s=re.sub(r'<style id="liuksoryu-(?:social-render-lock|header-icon-lock|header-icon-lock-v2|social-render-lock-v2)">.*?</style>', '', s, flags=re.S)
          final_css='''<style id="liuksoryu-final-social-render-lock">.socials .social{display:grid!important;visibility:visible!important;opacity:1!important;place-items:center!important;overflow:visible!important}.socials .social svg{display:block!important;visibility:visible!important;opacity:1!important;overflow:visible!important;flex:none!important}.socials .social[aria-label="Discord"] svg{width:22px!important;height:22px!important}.socials .social[aria-label="Discord"] svg path{fill:currentColor!important;stroke:none!important}.socials .social[aria-label="X"] svg{width:21px!important;height:21px!important}.socials .social[aria-label="X"] svg path{fill:currentColor!important;stroke:none!important}@media(max-width:900px){.socials .social{display:grid!important}.socials .social[aria-label="X"]{display:grid!important}}@media(max-width:600px){.socials{gap:5px!important}.socials .social{width:36px!important;height:36px!important;flex:0 0 36px!important}.socials .social[aria-label="Discord"] svg{width:19px!important;height:19px!important}.socials .social[aria-label="X"] svg{width:18px!important;height:18px!important}}</style>'''
          s=s.replace('</head>',final_css+'</head>',1)
          if 'id="mobilePreviewOverlay"' not in s or 'id="mobilePreviewToggle"' not in s or 'id="mobilePreviewFrame"' not in s or '?mobile-preview=1' not in s or 'mobile-preview-embedded' not in s:
              raise SystemExit('Mobile Preview contract is incomplete; refusing to invent a replacement in this surgical repair.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Strengthen homepage protection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/protect-homepage-architecture.yml')
          s=p.read_text(encoding='utf-8')
          marker='''          # FINAL SOCIAL SVG CONTRACT\n          grep -q 'id="liuksoryu-final-social-render-lock"' index.html || { echo "Missing final social render lock"; exit 1; }\n          grep -q 'M20.317 4.3698' index.html || { echo "Canonical Discord path missing"; exit 1; }\n          test "$(grep -o 'M20.317 4.3698' index.html | wc -l | tr -d ' ')" -ge 2 || { echo "Canonical Discord path must exist for header and community"; exit 1; }\n          grep -q 'aria-label="X"><svg' index.html || { echo "Header X SVG missing"; exit 1; }\n          grep -q 'M18.244 2.25h3.308' index.html || { echo "Canonical X path missing"; exit 1; }\n          grep -q 'aria-label="X"><svg[^>]*>.*fill="currentColor"' index.html || { echo "Header X fill contract missing"; exit 1; }\n          ! grep -q 'M20.3 4.3A19.8' index.html || { echo "Malformed Discord path still present"; exit 1; }\n          ! grep -q '\.social:nth-child(n+4){display:none}' index.html || { echo "Obsolete social hiding rule still present"; exit 1; }\n          # MOBILE PREVIEW CONTRACT\n          grep -q 'id="mobilePreviewToggle"' index.html || { echo "Missing mobile preview toggle"; exit 1; }\n          grep -q 'id="mobilePreviewOverlay"' index.html || { echo "Missing mobile preview overlay"; exit 1; }\n          grep -q 'id="mobilePreviewDevice"' index.html || { echo "Missing mobile preview device"; exit 1; }\n          grep -q 'id="mobilePreviewLabel"' index.html || { echo "Missing mobile preview label"; exit 1; }\n          grep -q 'id="mobilePreviewClose"' index.html || { echo "Missing mobile preview close"; exit 1; }\n          grep -q 'id="mobilePreviewFrame"' index.html || { echo "Missing mobile preview frame"; exit 1; }\n          grep -q '?mobile-preview=1' index.html || { echo "Missing mobile preview recursion URL"; exit 1; }\n          grep -q 'mobile-preview-embedded' index.html || { echo "Missing mobile preview recursion guard"; exit 1; }\n          grep -q 'id="liuksoryu-mobile-preview-script"' index.html || { echo "Missing mobile preview script lock"; exit 1; }\n'''
          if 'FINAL SOCIAL SVG CONTRACT' not in s:
              # Insert immediately before the final success message in the existing validation step.
              anchor='          echo "Homepage architecture protection passed."'
              if anchor not in s:
                  raise SystemExit('Could not locate homepage protection insertion point')
              s=s.replace(anchor,marker+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove obsolete one-time repair workflows
        shell: bash
        run: |
          rm -f .github/workflows/repair-discord-path-and-protect-once.yml .github/workflows/repair-homepage-once.yml .github/workflows/repair-icons-preview-once.yml
      - name: Commit and push repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/protect-homepage-architecture.yml .github/workflows/final-social-preview-repair.yml
          git rm -f .github/workflows/repair-discord-path-and-protect-once.yml .github/workflows/repair-homepage-once.yml .github/workflows/repair-icons-preview-once.yml 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Fix canonical social SVGs and harden mobile preview protection'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Remove this one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/final-social-preview-repair.yml
          git commit -m 'Remove one-time final repair workflow'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
