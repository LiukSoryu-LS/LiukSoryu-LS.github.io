name: One-time video thumbnail overlay fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix video thumbnail overlay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical CSS fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.video .image-slot{aspect-ratio:16/9}'
          fix=old+'.video .image-slot::after{display:none!important;content:none!important}'
          if fix in s: raise SystemExit(0)
          if s.count(old)!=1: raise SystemExit(f'Expected one target, found {s.count(old)}')
          p.write_text(s.replace(old,fix,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix video thumbnail overlay'
          git push
