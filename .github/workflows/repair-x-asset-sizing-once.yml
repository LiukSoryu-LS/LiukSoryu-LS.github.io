name: Temporary X asset sizing repair

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact X asset sizing to PR branch
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PR_BRANCH"
          git checkout -B "$PR_BRANCH" "origin/$PR_BRANCH"
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.socials .social[aria-label="X"] svg{width:21px!important;height:21px!important}'
          new=old+'.socials .social[aria-label="X"] .liuksoryu-header-x-asset{width:21px!important;height:21px!important;display:block!important;object-fit:contain!important;flex:none!important}.socials .social[aria-label="X"] .liuksoryu-header-x-asset{max-width:100%!important;max-height:100%!important}'
          if old not in s: raise SystemExit('Expected X render-lock sizing anchor not found')
          if '.liuksoryu-header-x-asset{width:21px!important;height:21px!important' in s: raise SystemExit('X asset sizing already present')
          s=s.replace(old,new,1)
          mobile=' .socials .social[aria-label="X"] svg{width:18px!important;height:18px!important}'
          mobile_new=mobile+'.socials .social[aria-label="X"] .liuksoryu-header-x-asset{width:18px!important;height:18px!important}'
          if mobile not in s: raise SystemExit('Expected mobile X sizing anchor not found')
          s=s.replace(mobile,mobile_new,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f _maintenance/x-asset-size-trigger.txt
          git add index.html _maintenance/x-asset-size-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Size branded X header asset' || true
          git push --force-with-lease origin "$PR_BRANCH"
      - name: Remove temporary workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/repair-x-asset-sizing-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/repair-x-asset-sizing-once.yml
          git commit -m 'Remove temporary X asset sizing workflow' || true
          git push origin main
