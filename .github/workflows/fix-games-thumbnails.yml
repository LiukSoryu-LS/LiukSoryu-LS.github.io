name: Fix Games playlist thumbnails

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-games-thumbnails.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Games cards with playlist thumbnails
        run: |
          python - <<'PY'
          import html as htmlmod
          import re
          import urllib.request
          from pathlib import Path

          games = [
              ('Wuthering Waves Lore — Podcast', 'https://youtube.com/playlist?list=PLSjzzcfb3AwA'),
              ('Genshin Impact', 'https://youtube.com/playlist?list=PL3gT64ipuP2Q4oL7gny6-uQTKGX6vrA9h'),
              ('Zenless Zone Zero (ZZZ)', 'https://youtube.com/playlist?list=PL3gT64ipuP2TJ-7CqMaOkUabLrfCJ112_'),
              ('Wuthering Waves', 'https://youtube.com/playlist?list=PLBU_IiYBDS9c'),
              ('Reverse: 1999', 'https://youtube.com/playlist?list=PL3gT64ipuP2S-_KTvJ0oJDdQIDpuDGAwq'),
              ('NTE', 'https://youtube.com/playlist?list=PLRiUfBOoP20M'),
              ('Chaos Zero Nightmare', 'https://youtube.com/playlist?list=PLHqebmkOvcn4'),
              ('Arknights: Endfield', 'https://youtube.com/playlist?list=PLNf6kMa6gAa8'),
              ('Honkai Star Rail', 'https://youtube.com/playlist?list=PLH_i2bw4m1HI'),
              ('And More To Come…', '#'),
          ]

          def first_video_id(playlist_url):
              if playlist_url == '#':
                  return None
              req = urllib.request.Request(playlist_url, headers={'User-Agent':'Mozilla/5.0'})
              data = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'ignore')
              # Prefer a videoId belonging to a playlistVideoRenderer, then fall back to the first videoId.
              m = re.search(r'"playlistVideoRenderer"\s*:\s*\{.*?"videoId"\s*:\s*"([A-Za-z0-9_-]{11})"', data, re.S)
              if m:
                  return m.group(1)
              m = re.search(r'"videoId"\s*:\s*"([A-Za-z0-9_-]{11})"', data)
              return m.group(1) if m else None

          cards = []
          for title, url in games:
              vid = first_video_id(url)
              if vid:
                  thumb = f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg'
                  image = f'<div class="image-slot has-image"><img src="{thumb}" alt="{htmlmod.escape(title)}" loading="lazy"></div>'
                  print(f'{title}: {vid}')
              else:
                  image = '<div class="image-slot"></div>'
                  print(f'{title}: no thumbnail')
              href = url
              cards.append(f'<a class="card game-card" href="{href}" target="_blank" rel="noopener">{image}<div class="game-name">{htmlmod.escape(title)}</div></a>')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('<div class="games">')
          end = s.index('</div></div></section>', start) + len('</div>')
          block = '<div class="games">' + ''.join(cards) + '</div>'
          s = s[:start] + block + s[end:]
          s = s.replace('.image-slot::after{content:\'YOUR IMAGE\';font:700 10px system-ui;letter-spacing:.18em;color:#806c9c}', '.image-slot::after{content:\'YOUR IMAGE\';font:700 10px system-ui;letter-spacing:.18em;color:#806c9c}.image-slot.has-image::after{display:none}')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-games-thumbnails.yml
          git commit -m 'Add thumbnails to Games playlist cards'
          git push
