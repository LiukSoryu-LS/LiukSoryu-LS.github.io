name: Temporary trusted X final repair
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix-x-final-bounds-20260907' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-x-final-bounds-20260907
          fetch-depth: 0
      - name: Append explicit final X bounds override
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="liuksoryu-final-x-visual-bounds"'
          if marker not in s:
              override='<style id="liuksoryu-final-x-visual-bounds">.socials .social[aria-label="X"] .liuksoryu-header-x-asset{width:18px!important;height:18px!important;max-width:18px!important;max-height:18px!important;display:block!important;object-fit:contain!important}@media(max-width:600px){.socials .social[aria-label="X"] .liuksoryu-header-x-asset{width:16px!important;height:16px!important;max-width:16px!important;max-height:16px!important}}</style>'
              s=s.replace('</head>',override+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Lock final X icon visual bounds'
          git push origin HEAD:fix-x-final-bounds-20260907