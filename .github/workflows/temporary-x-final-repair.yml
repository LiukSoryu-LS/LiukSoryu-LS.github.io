name: Temporary trusted X final repair
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix-x-final-bounds-20260907' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-x-final-bounds-20260907
          fetch-depth: 0
      - name: Set final X visual bounds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pat=r'(\.socials \.social\[aria-label="X"\] \.liuksoryu-header-x-asset\{width:)\d+px(!important;height:)\d+px(!important;display:block!important;object-fit:contain!important;flex:none!important;max-width:)\d+px(!important;max-height:)\d+px(!important)'
          s,n1=re.subn(pat,r'\g<1>18px\g<2>18px\g<3>18px\g<4>18px\g<5>',s,count=1)
          mob=r'(@media\(max-width:600px\).*?\.socials \.social\[aria-label="X"\] \.liuksoryu-header-x-asset\{width:)\d+px(!important;height:)\d+px(!important;display:block!important;object-fit:contain!important;flex:none!important;max-width:)\d+px(!important;max-height:)\d+px(!important)'
          s,n2=re.subn(mob,r'\g<1>16px\g<2>16px\g<3>16px\g<4>16px\g<5>',s,count=1,flags=re.S)
          print(n1,n2)
          assert n1==1 and n2==1
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Set final X icon visual bounds' || exit 0
          git push origin HEAD:fix-x-final-bounds-20260907