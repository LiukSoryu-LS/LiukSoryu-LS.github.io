name: Validate protected homepage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate immutable homepage contracts
        shell: python
        run: |
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")

          checks = {
              "mobile preview lock": 'id="liuksoryu-mobile-preview-lock"' in html,
              "mobile preview marker": "LIUKSORYU-MOBILE-PREVIEW-LOCKED" in html,
              "mobile preview toggle": 'id="mobilePreviewToggle"' in html,
              "mobile preview overlay": 'id="mobilePreviewOverlay"' in html,
              "mobile preview device": 'id="mobilePreviewDevice"' in html,
              "mobile preview label": 'id="mobilePreviewLabel"' in html,
              "mobile preview close": 'id="mobilePreviewClose"' in html,
              "mobile preview frame": 'id="mobilePreviewFrame"' in html,
              "mobile preview query": "?mobile-preview=1" in html,
              "mobile preview recursion guard": "mobile-preview-embedded" in html,
              "mobile preview script": 'id="liuksoryu-mobile-preview-script"' in html,
              "no fourth-icon hiding selector": ".social:nth-child(n+4)" not in html,
              "social render lock": 'id="liuksoryu-final-social-render-lock"' in html,
              "Discord label": 'aria-label="Discord"' in html,
              "X label": 'aria-label="X"' in html,
              "two protected Discord SVG paths": html.count("M20.317 4.3698") == 2,
              "canonical X SVG path": "M18.244 2.25h3.308" in html,
              "exactly one header X SVG": html.count('aria-label="X"><svg') == 1,
              "exactly one community X text icon": html.count('<div class="community-icon">𝕏</div>') == 1,
              "community SVG sizing": 'community-icon svg{width:22px;height:22px;display:block}' in html,
              "malformed Discord path absent": "M20.3 4.3A19.8" not in html,
              "five protected video cards": html.count('class="card video" data-video-card') == 5,
              "video loader": "fetch('videos.json?v='+Date.now()" in html,
              "personal profile asset": "Profile.jpg" in html,
              "community asset": "profilediscordcommunity.png" in html,
          }

          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}: {name}")

          if failed:
              raise SystemExit("Homepage regression gate failed: " + ", ".join(failed))

          print("Protected homepage validation passed.")
