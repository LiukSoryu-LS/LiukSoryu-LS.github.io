name: One-time homepage social preview repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Apply homepage social preview repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair header Discord and X and restore mobile preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="liuksoryu-social-render-lock">.socials .social{display:grid!important;visibility:visible!important;opacity:1!important;place-items:center!important}.socials .social svg{display:block!important;visibility:visible!important;opacity:1!important;overflow:visible!important;flex:none!important}.socials .social[aria-label="Discord"] svg{width:22px!important;height:22px!important}.socials .social[aria-label="Discord"] svg path{fill:#fff!important;stroke:none!important}.socials .social[aria-label="X"] svg{width:21px!important;height:21px!important}.socials .social[aria-label="X"] svg path{fill:#fff!important;stroke:none!important}@media(max-width:900px){.socials .social[aria-label="X"]{display:grid!important}}@media(max-width:600px){.socials{gap:5px!important}.socials .social[aria-label="Discord"] svg{width:19px!important;height:19px!important}.socials .social[aria-label="X"] svg{width:18px!important;height:18px!important}}</style>'''
          if 'id="liuksoryu-social-render-lock"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          old='''<a class="social" href="https://discord.gg/DwHKtRMX2g" target="_blank" rel="noopener" aria-label="Discord"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M20.3 4.3A19.8 19.8 0 0 0 15.4 2.8l-.6 1.2a13.7 13.7 0 0 0-5.6 0L8.6 2.8A19.8 19.8 0 0 0 3.7 4.3C.8 8.5-.1 12.6.3 16.7a19.9 19.9 0 0 0 6.1 3.1l1.5-2.1a12.7 12.7 0 0 1-2.4-1.2l.6-.4c4.7 2.2 9.7 2.2 14.4 0l.6.4a12.7 12.7 0 0 1-2.4 1.2l1.5 2.1a19.9 19.9 0 0 0 6.1-3.1c.5-4.1-.4-8.2-3.3-12.4zM8.7 14.4c-1.4 0-2.6-1.3-2.6-2.9s1.2-2.9 2.6-2.9 2.6 1.3 2.6 2.9-1.2 2.9-2.6 2.9zm6.6 0c-1.4 0-2.6-1.3-2.6-2.9-1.2-1.6-2.6-2.9-2.6-2.9z"/></svg></a>'''
          new='''<a class="social" href="https://discord.gg/DwHKtRMX2g" target="_blank" rel="noopener" aria-label="Discord"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none"><path fill="currentColor" d="M20.317 4.3698a19.7913 19.7913 0 0 0-4.8851-1.5152.0741.0741 0 0 0-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 0 0-.0785-.037A19.7363 19.7363 0 0 0 3.677 4.3698a.0699.0699 0 0 0-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 0 0 .0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 0 0 .0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 0 0-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 0 1-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 0 1 .0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 0 1 .0785.0095c.1202.099.246.198.3728.2924a.077.077 0 0 1-.0066.1276c-.6.35-1.227.648-1.873.8914a.0766.0766 0 0 0-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 0 0 .0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 0 0 .0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 0 0-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"/></svg></a>'''
          if old in s: s=s.replace(old,new,1)
          if 'id="mobilePreviewOverlay"' not in s:
              css2='''<style id="liuksoryu-mobile-preview-lock-v2">#mobilePreviewOverlay{position:fixed;inset:0;z-index:9999;background:rgba(4,2,12,.78);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}body.mobile-preview-open #mobilePreviewOverlay{display:flex}#mobilePreviewDevice{position:relative;width:min(390px,92vw);height:min(844px,92vh);background:#090615;border:8px solid #1d1530;border-radius:32px;box-shadow:0 25px 80px rgba(0,0,0,.6),0 0 40px rgba(184,150,255,.25);overflow:hidden}#mobilePreviewLabel{position:absolute;top:0;left:0;right:0;height:30px;background:#130d28;color:#fff;font:700 11px/30px system-ui,sans-serif;letter-spacing:.14em;text-align:center;z-index:4}#mobilePreviewFrame{position:absolute;left:0;top:30px;width:100%;height:calc(100% - 30px);border:0;background:#090615}#mobilePreviewClose{position:absolute;top:3px;left:6px;z-index:5;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;font:700 18px/24px system-ui,sans-serif;cursor:pointer}body.mobile-preview-embedded #mobilePreviewToggle,body.mobile-preview-embedded #mobilePreviewOverlay{display:none!important}@media(max-width:600px){#mobilePreviewOverlay{padding:8px}#mobilePreviewDevice{width:calc(100vw - 16px);height:calc(100vh - 16px);border-width:6px;border-radius:24px}#mobilePreviewLabel{height:28px;line-height:28px;padding-left:34px}#mobilePreviewFrame{top:28px;height:calc(100% - 28px)}}@media(max-width:600px){#mobilePreviewToggle{display:none!important}}</style>'''
              s=s.replace('</head>',css2+'</head>',1)
              html='''<div id="mobilePreviewOverlay" aria-hidden="true"><div id="mobilePreviewDevice"><div id="mobilePreviewLabel">MOBILE PREVIEW</div><button id="mobilePreviewClose" type="button" aria-label="Close mobile preview">×</button><iframe id="mobilePreviewFrame" title="LIUKSORYU mobile preview"></iframe></div></div><button id="mobilePreviewToggle" type="button" aria-label="Open mobile preview" title="Open mobile preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M10 5h4M11 18.5h2"/></svg></button><script id="liuksoryu-mobile-preview-script">(function(){var b=document.getElementById('mobilePreviewToggle'),o=document.getElementById('mobilePreviewOverlay'),f=document.getElementById('mobilePreviewFrame'),c=document.getElementById('mobilePreviewClose');if(!b||!o||!f)return;if(new URLSearchParams(location.search).has('mobile-preview')){document.body.classList.add('mobile-preview-embedded');return;}function close(){document.body.classList.remove('mobile-preview-open');o.setAttribute('aria-hidden','true');}function open(){document.body.classList.add('mobile-preview-open');o.setAttribute('aria-hidden','false');if(!f.src){f.src=location.href.split('#')[0].split('?')[0]+'?mobile-preview=1';}}b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();document.body.classList.contains('mobile-preview-open')?close():open();});c&&c.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();close();});o.addEventListener('click',function(e){if(e.target===o)close();});document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});})();</script>'''
              s=s.replace('</body>',html+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply homepage social preview repair'
          git rm .github/workflows/repair-socials-preview-main-once.yml
          git commit -m 'Remove one-time homepage social preview repair workflow'
          git push
