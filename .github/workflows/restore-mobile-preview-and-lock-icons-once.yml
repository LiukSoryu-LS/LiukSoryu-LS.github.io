name: Restore mobile preview and lock header icons once

on:
  push:
    branches: [reinforce-mobile-preview-protection]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair homepage safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='LIUKSORYU-MOBILE-PREVIEW-LOCKED'
          if marker in s: raise SystemExit('Repair already present.')
          css='''<style id="liuksoryu-mobile-preview-lock">/* LIUKSORYU-MOBILE-PREVIEW-LOCKED */
          #mobilePreviewToggle{position:fixed;right:18px;bottom:18px;width:52px;height:52px;z-index:2147483646;border:2px solid transparent;border-radius:16px;display:grid;place-items:center;color:#fff;cursor:pointer;background:linear-gradient(rgba(20,12,38,.96),rgba(20,12,38,.96)) padding-box,linear-gradient(110deg,#ef83ff,#b896ff,#7edcff) border-box;box-shadow:0 8px 24px rgba(0,0,0,.35)}
          #mobilePreviewToggle svg{width:24px;height:24px;display:block;pointer-events:none}
          #mobilePreviewOverlay{position:fixed;inset:0;z-index:2147483645;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(4,2,12,.8);backdrop-filter:blur(8px)}
          body.mobile-preview-open{overflow:hidden}body.mobile-preview-open #mobilePreviewOverlay{display:flex}
          #mobilePreviewDevice{width:min(390px,calc(100vw - 28px));height:min(844px,calc(100vh - 28px));border:7px solid #171022;border-radius:30px;background:#000;box-shadow:0 0 0 2px #6f4b9e,0 25px 80px rgba(0,0,0,.65);overflow:hidden;position:relative}
          #mobilePreviewLabel{position:absolute;top:0;left:0;right:0;height:30px;z-index:3;background:rgba(12,7,24,.96);color:#d9c7ec;text-align:center;font:700 9px/30px system-ui,sans-serif;letter-spacing:.14em;pointer-events:none}
          #mobilePreviewFrame{position:absolute;left:0;top:30px;width:100%;height:calc(100% - 30px);border:0;background:#090615}
          #mobilePreviewClose{position:absolute;top:3px;left:6px;z-index:5;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;font:700 18px/24px system-ui,sans-serif;cursor:pointer}
          #mobilePreviewClose:hover{background:rgba(239,131,255,.85);color:#160b22}
          body.mobile-preview-embedded #mobilePreviewToggle,body.mobile-preview-embedded #mobilePreviewOverlay{display:none!important}
          @media(max-width:600px){#mobilePreviewOverlay{padding:8px}#mobilePreviewDevice{width:calc(100vw - 16px);height:calc(100vh - 16px);border-width:6px;border-radius:24px}#mobilePreviewLabel{height:28px;line-height:28px;padding-left:34px}#mobilePreviewFrame{top:28px;height:calc(100% - 28px)}}
          </style>'''
          html='''<div id="mobilePreviewOverlay" aria-hidden="true"><div id="mobilePreviewDevice"><div id="mobilePreviewLabel">MOBILE PREVIEW</div><button id="mobilePreviewClose" type="button" aria-label="Close mobile preview">×</button><iframe id="mobilePreviewFrame" title="LIUKSORYU mobile preview"></iframe></div></div><button id="mobilePreviewToggle" type="button" aria-label="Open mobile preview" title="Open mobile preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M10 5h4M11 18.5h2"/></svg></button>'''
          js='''<script id="liuksoryu-mobile-preview-script">(function(){var b=document.getElementById('mobilePreviewToggle'),o=document.getElementById('mobilePreviewOverlay'),f=document.getElementById('mobilePreviewFrame'),c=document.getElementById('mobilePreviewClose');if(!b||!o||!f)return;if(new URLSearchParams(location.search).has('mobile-preview')){document.body.classList.add('mobile-preview-embedded');return;}function close(){document.body.classList.remove('mobile-preview-open');o.setAttribute('aria-hidden','true');}function open(){document.body.classList.add('mobile-preview-open');o.setAttribute('aria-hidden','false');if(!f.src){f.src=location.href.split('#')[0].split('?')[0]+'?mobile-preview=1';}}b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();document.body.classList.contains('mobile-preview-open')?close():open();});c&&c.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();close();});o.addEventListener('click',function(e){if(e.target===o)close();});document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});})();</script>'''
          header_css='''<style id="liuksoryu-header-icon-lock">.socials{display:flex!important;gap:8px!important;align-items:center!important}.socials .social{display:grid!important;visibility:visible!important;opacity:1!important;width:44px!important;height:44px!important;flex:0 0 44px!important;place-items:center!important;color:#fff!important}.socials .social svg{width:20px!important;height:20px!important;display:block!important;visibility:visible!important;opacity:1!important;overflow:visible!important;flex:none!important;fill:currentColor}.socials .social svg rect{fill:#fff}.socials .social[aria-label="YouTube"] svg path{fill:#130d28}.socials .social[aria-label="X"] svg path,.socials .social[aria-label="Twitch"] svg path,.socials .social[aria-label="Discord"] svg path{fill:currentColor}@media(max-width:900px){.socials .social{display:grid!important}.socials .social[aria-label="X"]{display:grid!important}}@media(max-width:600px){.socials{gap:5px!important}.socials .social{width:36px!important;height:36px!important;flex-basis:36px!important;border-radius:11px!important}.socials .social svg{width:18px!important;height:18px!important}}</style>'''
          if '</head>' not in s or '</body>' not in s: raise SystemExit('Malformed homepage; refusing edit.')
          s=s.replace('</head>',css+header_css+'</head>',1).replace('</body>',html+js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['LIUKSORYU-MOBILE-PREVIEW-LOCKED','id="mobilePreviewToggle"','id="mobilePreviewOverlay"','id="mobilePreviewDevice"','id="mobilePreviewClose"','id="mobilePreviewFrame"','?mobile-preview=1','mobile-preview-embedded','id="liuksoryu-header-icon-lock"']:
              if x not in s: raise SystemExit(f'Missing marker: {x}')
          print('Repair verification passed.')
          PY
      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/restore-mobile-preview-and-lock-icons-once.yml
          git commit -m 'Restore mobile preview and lock header icons'
          git push
